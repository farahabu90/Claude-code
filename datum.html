<meta name="claude:viewport-fit-sides" content="cover">
<title>Datum Drafting Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-bleed drawing sheet (canvas) with soft floating toolbars resting in its corners. */
:root{
  --paper:#ECEFEA;   /* sage-grey drafting paper */
  --panel:rgba(251,252,250,.84);
  --solid:#FBFCFA;
  --ink:#2B3942;     /* soft graphite ink */
  --muted:#7A8790;
  --grid:#C9D3CC;
  --face:#FBFCFA;    /* resolved surface before colour */
  --accent:#2F8F7E;  /* calm teal pencil */
  --on-accent:#FFFFFF;
  --line:rgba(43,57,66,.12);
  --shadow:0 1px 2px rgba(32,48,44,.06),0 8px 24px rgba(32,48,44,.10);
  --serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
  --gx:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B252E; --panel:rgba(35,46,56,.86); --solid:#26333E; --ink:#E3E9EC; --muted:#93A2AC; --grid:#2E3C47;
    --face:#2B3946; --accent:#E8B76B; --on-accent:#1B252E; --line:rgba(227,233,236,.12);
    --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1B252E; --panel:rgba(35,46,56,.86); --solid:#26333E; --ink:#E3E9EC; --muted:#93A2AC; --grid:#2E3C47;
  --face:#2B3946; --accent:#E8B76B; --on-accent:#1B252E; --line:rgba(227,233,236,.12);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}

.corner{position:absolute;display:flex;gap:10px;z-index:2}
.tl{top:14px;left:var(--gx);align-items:center}
.tr{top:14px;right:var(--gr);flex-wrap:wrap;justify-content:flex-end;align-items:center}
.bl{bottom:14px;left:var(--gx);right:var(--gr);pointer-events:none;align-items:flex-end;justify-content:flex-start}
.bl > *{pointer-events:auto}
.br{bottom:14px;right:var(--gr)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
.brand{display:flex;align-items:center;gap:9px;padding:0 16px 0 12px;min-height:46px}
.brand svg{flex:none;display:block;width:31px;height:34px}
.brand b{font:800 22px/1 var(--sans);letter-spacing:-.03em;padding-bottom:2px}

button{font:600 12.5px/1 var(--sans);color:var(--ink);background:transparent;border:0;border-radius:11px;
  min-height:42px;min-width:42px;padding:0 13px;cursor:pointer;touch-action:manipulation;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,color .15s}
button svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button:hover{background:var(--line)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--solid)}
button.go{background:var(--accent);color:var(--on-accent)}
.chip{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#btnSound[aria-pressed="true"]{background:var(--panel);color:var(--ink)}
#btnSound[aria-pressed="false"]{color:var(--muted)}

.seg{display:flex;gap:2px;padding:3px;border-radius:14px;background:var(--line)}
.seg button{min-height:38px;border-radius:10px;padding:0 11px}
.seg button[aria-pressed="true"]{background:var(--solid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tools button{flex-direction:column;gap:3px;font-size:10.5px;font-weight:600;min-height:50px;min-width:52px;padding:4px 6px}
.tools button[aria-pressed="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.views button{font-size:12px;padding:0 12px}
.seg.chip{background:var(--panel)}
.seg.chip button[aria-pressed="true"]{background:var(--line)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:8px 10px;max-width:100%}
.sep{width:1px;align-self:stretch;background:var(--line);margin:4px 0}
.next{display:flex;align-items:baseline;gap:6px;padding:0 8px 0 6px}
.next small{font-size:10.5px;color:var(--muted);margin-right:4px}
.next b{font:400 38px/1 var(--serif);font-variant-numeric:tabular-nums;min-width:1.25em;text-align:center}
.next i{font:400 12px var(--mono);font-style:normal;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(7,24px);gap:6px}
.sw{min-width:0;min-height:0;width:24px;height:24px;padding:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .15s}
.sw:hover{transform:scale(1.12);background-image:none}
.sw[aria-pressed="true"]{box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 0 0 2px var(--solid),0 0 0 4px var(--ink);transform:scale(1.05)}
.sliders{display:grid;gap:6px}
.size{display:grid;grid-template-columns:52px 96px;align-items:center;font-size:10.5px;color:var(--muted)}
.size input{width:96px;accent-color:var(--accent)}
.group{display:flex;gap:2px}

#tb{display:flex;flex-direction:column;gap:6px;min-width:236px;padding:12px 16px 12px}
#tb .name{font:italic 400 26px/1.05 var(--serif)}
#tb .meta{display:flex;gap:14px;font:400 10.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
#tb .meta b{font-weight:500;color:var(--ink)}
#tb .track{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
#tb .track i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
#tbView{display:none}

#drawer{position:absolute;z-index:3;top:72px;left:var(--gx);width:min(340px,calc(100% - var(--gx) - var(--gr)));
  max-height:calc(100% - 96px);overflow:auto;display:flex;flex-direction:column;padding:6px}
#drawer h2{margin:0;padding:10px 12px 8px;font:italic 400 22px var(--serif)}
#drawer .sheet{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;
  min-height:58px;width:100%;padding:6px 10px;border-radius:12px;font-weight:500;justify-content:stretch}
#drawer .sheet b{font:500 11px var(--mono);color:var(--muted)}
#drawer .sheet em{font:italic 400 19px/1.1 var(--serif)}
#drawer .sheet small{font-size:10.5px;color:var(--muted)}
#drawer .sheet .st{font-size:10.5px;padding:4px 8px;border-radius:20px;background:var(--line);color:var(--ink)}
#drawer .sheet .st.ok{background:var(--accent);color:var(--on-accent)}
#drawer .sheet[aria-current="true"]{background:var(--line);color:var(--ink)}
#drawer .foot{padding:8px 4px 4px;display:flex}
#drawer .foot button{flex:1;background:var(--line)}
#drawer .foot button.go{background:var(--accent)}

#toast{position:absolute;z-index:4;left:50%;top:76px;transform:translateX(-50%);max-width:min(480px,calc(100% - 32px));
  padding:11px 18px;text-align:center;line-height:1.5;font-weight:500;pointer-events:none;transition:opacity .4s,transform .4s;border-radius:22px}
#toast[data-show="0"]{opacity:0;transform:translate(-50%,-6px)}

@media (max-width:900px){ #tb{display:none} .tools button span{display:none} .tools button{min-height:42px;min-width:44px} }
@media (min-width:901px){ .bl{right:calc(var(--gr) + 282px)} }
@media (max-width:640px){
  .tr .views{display:none}
  #connectBar span{display:none}
  .sep{display:none}
  .swatches{grid-template-columns:repeat(13,22px);gap:5px}
  .sw{width:22px;height:22px}
}
@media (prefers-reduced-motion: reduce){ #toast,button,.sw,#tb .track i{transition:none} }
</style>

<div id="app">
  <canvas id="cv" aria-label="Drawing sheet. Connect the numbered dots in order; rotate the view to find hidden ones."></canvas>

  <div class="corner tl">
    <div class="panel brand" role="img" aria-label="Datum, 3D dot-to-dot drafting book"><svg viewBox="-.5 -2.5 31 34" aria-hidden="true"><path d="M7 4 L7 26 L16 25 L23 15 L16 5 Z" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linejoin="round"/><circle cx="7" cy="4" r="4.3" fill="var(--accent)" stroke="var(--accent)" stroke-width="2.75"/><circle cx="7" cy="26" r="3" fill="var(--solid)" stroke="currentColor" stroke-width="2.75"/><circle cx="16" cy="25" r="3" fill="var(--solid)" stroke="currentColor" stroke-width="2.75"/><circle cx="23" cy="15" r="3" fill="var(--solid)" stroke="currentColor" stroke-width="2.75"/><circle cx="16" cy="5" r="3" fill="var(--solid)" stroke="currentColor" stroke-width="2.75"/></svg><b>datum</b></div>
    <button id="btnSheets" class="chip" data-icon="sheets" aria-expanded="false" aria-controls="drawer"><span>Sheets</span></button>
  </div>

  <div class="corner tr">
    <div class="seg views chip" id="viewGroup" role="group" aria-label="Standard views">
      <button data-view="iso">Iso</button><button data-view="top">Top</button><button data-view="front">Front</button><button data-view="side">Side</button>
    </div>
    <button id="btnTheme" class="chip" data-icon="theme" aria-label="Switch day and night paper" title="Day / night paper"></button>
    <button id="btnSound" class="chip" data-icon="sound" aria-pressed="true" aria-label="Sound" title="Pencil and click sounds"></button>
  </div>

  <div class="corner bl">
    <div class="panel bar" id="connectBar">
      <div class="next"><small>Next</small><b id="nextNo">01</b><i id="nextOf">/ 00</i></div>
      <div class="sep"></div>
      <button id="btnLocate" data-icon="locate"><span>Find it</span></button>
      <button id="btnBack" data-icon="back"><span>Step back</span></button>
    </div>
    <div class="panel bar" id="colourBar" hidden>
      <div class="group tools" role="group" aria-label="Tool">
        <button data-tool="marker" data-icon="marker" aria-pressed="true"><span>Marker</span></button><button data-tool="pencil" data-icon="pencil"><span>Pencil</span></button><button data-tool="fill" data-icon="fill"><span>Fill</span></button><button data-tool="hatch" data-icon="hatch"><span>Hatch</span></button><button data-tool="wipe" data-icon="wipe"><span>Wipe</span></button><button data-tool="orbit" data-icon="orbit"><span>Orbit</span></button>
      </div>
      <div class="sep"></div>
      <div class="swatches" id="swatches" role="group" aria-label="Colour"></div>
      <div class="sep"></div>
      <div class="seg" id="hatchKinds" role="group" aria-label="Hatch pattern" hidden>
        <button data-hatch="diag" aria-pressed="true">Diag</button><button data-hatch="cross">Cross</button><button data-hatch="lines">Lines</button><button data-hatch="stipple">Dots</button>
      </div>
      <div class="sliders">
        <label class="size" id="sizeWrap" for="size">Size <input id="size" type="range" min="4" max="44" value="16"></label>
        <label class="size" for="alpha">Opacity <input id="alpha" type="range" min="10" max="100" value="80"></label>
      </div>
      <div class="seg" id="planeKinds" role="group" aria-label="Surface to draw on">
        <button data-plane="form" data-icon="form" aria-pressed="true" title="Draw on the object"><span>Form</span></button><button data-plane="ground" data-icon="ground" title="Draw on the ground plane"><span>Ground</span></button><button data-plane="wall" data-icon="wall" title="Draw on the backdrop"><span>Backdrop</span></button>
      </div>
      <div class="group"><button id="btnUndo" data-icon="undo" aria-label="Undo" title="Undo"></button><button id="btnClear" data-icon="clear" aria-label="Clear colour" title="Clear colour"></button></div>
    </div>
  </div>

  <aside class="corner br panel" id="tb" aria-label="Sheet">
    <div class="meta"><span id="tbNo">A-01</span><span id="tbStatus">Setting out</span><span id="tbView">315° / 35°</span></div>
    <div class="name" id="tbName">Unidentified</div>
    <div class="track"><i id="tbBar" style="width:0"></i></div>
    <div class="meta"><span><b id="tbPts">0 / 0</b> points</span></div>
  </aside>

  <div id="drawer" class="panel" hidden>
    <h2>Sheets</h2>
    <div id="sheetList"></div>
    <div class="foot"><button id="btnReset">Reset this sheet</button></div>
  </div>

  <div id="toast" class="panel" role="status" data-show="0"></div>
</div>

<script>
(() => {
'use strict';
/* ---------- vector helpers ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]), unit=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l,a[2]/l];};

function inPoly(L,x,y){let c=false;for(let i=0,j=L.length-1;i<L.length;j=i++){const a=L[i],b=L[j];
  if((a[1]>y)!==(b[1]>y) && x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]) c=!c;}return c;}

/* ---------- mesh building ---------- */
/* A vertex is a numbered dot only if it was placed while m.dot was on; detail parts and insets
   add geometry that appears when the drawing resolves, without adding dots. */
function mesh(){return {P:[],F:[],D:[],keys:new Map(),dot:true,detail:false};}
function vid(m,p){if(m.xf)p=m.xf(p);const k=p.map(n=>Math.round(n*1e4)).join(',');let i=m.keys.get(k);
  if(i===undefined){i=m.P.length;m.P.push(p.slice());m.D.push(false);m.keys.set(k,i);}if(m.dot)m.D[i]=true;return i;}
function face(m,pts,sheet,decal){let v=pts.map(p=>vid(m,p)).filter((id,i,a)=>id!==a[(i+1)%a.length]);
  if(v.length>=3) m.F.push({v,sheet:!!sheet,decal:!!decal,occ:!m.detail&&!decal});}
function detail(m,fn){const d=m.dot,dt=m.detail;m.dot=false;m.detail=true;fn();m.dot=d;m.detail=dt;}
/* a panel (window, door) drawn on part of a wall quad q; u runs along q[0]->q[1], v along q[0]->q[3] */
function inset(m,q,u0,u1,v0,v1,out){const L=(a,b,t)=>add(mul(a,1-t),mul(b,t)),P=(u,v)=>L(L(q[0],q[1],u),L(q[3],q[2],u),v);
  let pts=[P(u0,v0),P(u1,v0),P(u1,v1),P(u0,v1)],n=unit(cross(sub(pts[1],pts[0]),sub(pts[3],pts[0])));
  if(!out){const c=mul(add(add(q[0],q[1]),add(q[2],q[3])),.25);out=[c[0],0,c[2]];}
  if(dot(n,out)<0){pts.reverse();n=mul(n,-1);}
  const d=m.dot;m.dot=false;face(m,pts.map(p=>add(p,mul(n,.008))),false,true);m.dot=d;}
const wallQ=(x0,z0,x1,z1,y0,y1)=>[[x0,y0,z0],[x1,y0,z1],[x1,y1,z1],[x0,y1,z0]];
const ringQ=(R,k,i)=>{const j=(i+1)%R[k].length;return [R[k][i],R[k][j],R[k+1][j],R[k+1][i]];};
function newell(m,v){let n=[0,0,0];for(let i=0;i<v.length;i++){const a=m.P[v[i]],b=m.P[v[(i+1)%v.length]];
  n[0]+=(a[1]-b[1])*(a[2]+b[2]);n[1]+=(a[2]-b[2])*(a[0]+b[0]);n[2]+=(a[0]-b[0])*(a[1]+b[1]);}return unit(n);}
function centroid(m,v){let c=[0,0,0];for(const i of v)c=add(c,m.P[i]);return mul(c,1/v.length);}
function geom(m,f){f.o=centroid(m,f.v);f.n=newell(m,f.v);f.u=unit(sub(m.P[f.v[1]],m.P[f.v[0]]));f.w=cross(f.n,f.u);
  f.L=f.v.map(i=>{const d=sub(m.P[i],f.o);return [dot(d,f.u),dot(d,f.w)];});}
/* A closed solid: after building, flip any face whose normal points into the solid (ray parity test). */
function solid(m,build){const from=m.F.length;build();const fs=m.F.slice(from);fs.forEach(f=>geom(m,f));
  const D=unit([0.3713,0.8291,0.4177]);
  for(const f of fs){const p=add(f.o,mul(f.n,1e-3));let hits=0;
    for(const g of fs){const dn=dot(D,g.n);if(Math.abs(dn)<1e-9)continue;const t=dot(sub(g.o,p),g.n)/dn;if(t<=1e-9)continue;
      const h=sub(add(p,mul(D,t)),g.o);if(inPoly(g.L,dot(h,g.u),dot(h,g.w)))hits++;}
    if(hits&1)f.v.reverse();}}
function lathe(m,rings,sides,phase=0,ox=0,oz=0){
  const R=rings.map(([r,y])=>Array.from({length:sides},(_,i)=>{const t=phase+i/sides*2*Math.PI;return [ox+r*Math.cos(t),y,oz+r*Math.sin(t)];}));
  const d=m.dot;rings.forEach((rg,k)=>{m.dot=d&&rg[2]!==0;R[k].forEach(p=>vid(m,p));});m.dot=false;
  solid(m,()=>{const last=R.length-1;
    if(rings[0][0]>0)face(m,R[0]);
    for(let k=0;k<last;k++)for(let i=0;i<sides;i++){const j=(i+1)%sides;face(m,[R[k][i],R[k][j],R[k+1][j],R[k+1][i]]);}
    if(rings[last][0]>0)face(m,R[last]);});
  m.dot=d;return R;}
function box(m,x0,x1,y0,y1,z0,z1){const p=(x,y,z)=>[x,y,z];solid(m,()=>{
  face(m,[p(x0,y0,z0),p(x1,y0,z0),p(x1,y0,z1),p(x0,y0,z1)]);face(m,[p(x0,y1,z0),p(x1,y1,z0),p(x1,y1,z1),p(x0,y1,z1)]);
  face(m,[p(x0,y0,z0),p(x1,y0,z0),p(x1,y1,z0),p(x0,y1,z0)]);face(m,[p(x0,y0,z1),p(x1,y0,z1),p(x1,y1,z1),p(x0,y1,z1)]);
  face(m,[p(x0,y0,z0),p(x0,y0,z1),p(x0,y1,z1),p(x0,y1,z0)]);face(m,[p(x1,y0,z0),p(x1,y0,z1),p(x1,y1,z1),p(x1,y1,z0)]);});}

/* ---------- the sheets ---------- */
const SHEETS=[
 {id:'boat',no:'A-01',name:'Sailing Dinghy',mm:2600,build(m){
   const bow=[1.3,.3,0],sr=[.5,.3,.42],ar=[-.9,.3,.36],al=[-.9,.3,-.36],sl=[.5,.3,-.42],kf=[.6,0,0],ka=[-.8,0,0];
   solid(m,()=>{face(m,[bow,sr,ar,al,sl]);face(m,[ar,al,ka]);
     face(m,[sr,ar,ka]);face(m,[sr,ka,kf]);face(m,[bow,sr,kf]);
     face(m,[sl,al,ka]);face(m,[sl,ka,kf]);face(m,[bow,sl,kf]);});
   const foot=[.1,.3,0],top=[.1,2.3,0],boom=[-.85,.55,0];
   face(m,[foot,top,boom],true);face(m,[top,bow,foot],true);}},
 {id:'gem',no:'A-02',name:'Brilliant-Cut Gem',mm:40,build(m){lathe(m,[[0,-1],[1,.15],[.6,.5]],8);}},
 {id:'cabin',no:'A-03',name:'Gabled Cabin',mm:4200,build(m){
   const X=.8,Z=.6,H=1,Rg=1.7;
   solid(m,()=>{const g=x=>[[x,0,-Z],[x,0,Z],[x,H,Z],[x,Rg,0],[x,H,-Z]];
     face(m,g(-X));face(m,g(X));
     face(m,[[-X,0,-Z],[X,0,-Z],[X,0,Z],[-X,0,Z]]);
     face(m,[[-X,0,Z],[X,0,Z],[X,H,Z],[-X,H,Z]]);face(m,[[-X,0,-Z],[X,0,-Z],[X,H,-Z],[-X,H,-Z]]);
     face(m,[[-X,H,Z],[X,H,Z],[X,Rg,0],[-X,Rg,0]]);face(m,[[-X,H,-Z],[X,H,-Z],[X,Rg,0],[-X,Rg,0]]);});
   box(m,X,X+.28,0,2.05,-.2,.2);}},
 {id:'zig',no:'A-04',name:'Stepped Ziggurat',mm:9000,build(m){

function finalize(s){
  const m=mesh();s.build(m);
  let lo=[1e9,1e9,1e9],hi=[-1e9,-1e9,-1e9];
  for(const p of m.P)for(let k=0;k<3;k++){lo[k]=Math.min(lo[k],p[k]);hi[k]=Math.max(hi[k],p[k]);}
  const c=mul(add(lo,hi),.5);let r=0;for(const p of m.P)r=Math.max(r,len(sub(p,c)));
  m.P=m.P.map(p=>mul(sub(p,c),1/r));m.F.forEach(f=>geom(m,f));
  m.ground=(lo[1]-c[1])/r;m.mm=s.mm/2;
  const n=m.P.length,F=m.F.length,adj=Array.from({length:n},()=>new Set());m.E=[];const seen=new Set();
  for(const f of m.F){if(!f.occ)continue;for(let i=0;i<f.v.length;i++){const a=f.v[i],b=f.v[(i+1)%f.v.length],k=a<b?a+'_'+b:b+'_'+a;
    if(!seen.has(k)){seen.add(k);m.E.push([a,b]);if(m.D[a]&&m.D[b]){adj[a].add(b);adj[b].add(a);}}}}
  m.incident=Array.from({length:n},()=>new Set());m.F.forEach((f,fi)=>f.v.forEach(i=>m.incident[i].add(fi)));
  /* each inset panel rides on the wall it lies against */
  m.F.forEach(f=>f.decals=[]);
  m.F.forEach((f,fi)=>{if(!f.decal)return;f.host=-1;m.F.forEach((h,hi)=>{if(f.host>=0||h.decal||dot(f.n,h.n)<.999)return;const d=sub(f.o,h.o);
    if(Math.abs(dot(d,h.n))<.03&&inPoly(h.L,dot(d,h.u),dot(d,h.w)))f.host=hi;});if(f.host>=0)m.F[f.host].decals.push(fi);});
  /* which side of face b's plane does face a sit on: used to draw faces back to front */
  m.side=new Int8Array(F*F);
  for(let a=0;a<F;a++)for(let b=0;b<F;b++){if(a===b)continue;const B=m.F[b];let mn=1e9,mx=-1e9;
    for(const i of m.F[a].v){const d=dot(sub(m.P[i],B.o),B.n);mn=Math.min(mn,d);mx=Math.max(mx,d);}
    m.side[a*F+b]=mx<=1e-4&&mn<-1e-4?-1:mn>=-1e-4&&mx>1e-4?1:0;}
  /* numbering: walk each connected piece along its edges (visiting every dot once where possible),
     then hop to the nearest dot of the next piece */
  const dots=[];for(let i=0;i<n;i++)if(m.D[i])dots.push(i);const nd=dots.length;
  const comp=new Int32Array(n).fill(-1);let nc=0;
  for(const d0 of dots){if(comp[d0]>=0)continue;const q=[d0];comp[d0]=nc;while(q.length){const a=q.pop();for(const b of adj[a])if(comp[b]<0){comp[b]=nc;q.push(b);}}nc++;}
  let start=dots[0];for(const i of dots)if(m.P[i][1]<m.P[start][1]-1e-6||(Math.abs(m.P[i][1]-m.P[start][1])<1e-6&&m.P[i][0]<m.P[start][0]))start=i;
  const vis=new Uint8Array(n),free=i=>{let d=0;for(const j of adj[i])if(!vis[j])d++;return d;};
  const nearest=(from,ok)=>{let bd=1e9,nx=-1;for(const j of dots)if(!vis[j]&&ok(j)){const d=len(sub(m.P[j],m.P[from]));if(d<bd){bd=d;nx=j;}}return nx;};
  const path=[];let cur=start;
  while(path.length<nd){
    const cc=comp[cur],cn=dots.filter(i=>comp[i]===cc).length,base=path.length;let steps=0;
    vis[cur]=1;path.push(cur);
    const dfs=()=>{if(path.length-base===cn)return true;if(++steps>20000)return false;
      const cand=[...adj[path[path.length-1]]].filter(j=>!vis[j]).sort((a,b)=>free(a)-free(b));
      for(const j of cand){vis[j]=1;path.push(j);if(dfs())return true;path.pop();vis[j]=0;}return false;};
    if(!dfs()){for(let k=base;k<path.length;k++)vis[path[k]]=0;path.length=base;vis[cur]=1;path.push(cur);
      while(path.length-base<cn){const c=path[path.length-1];const cand=[...adj[c]].filter(j=>!vis[j]).sort((a,b)=>free(a)-free(b));
        const nx=cand.length?cand[0]:nearest(c,j=>comp[j]===cc);vis[nx]=1;path.push(nx);}}
    if(path.length<nd)cur=nearest(path[path.length-1],()=>true);
  }
  m.order=path;m.rank=new Int32Array(n).fill(-1);path.forEach((v,k)=>m.rank[v]=k);
  m.jump=path.map((v,k)=>k>0&&!adj[v].has(path[k-1]));
  return m;
}

function loadSheet(i){
  st.sheet=i;M=SHEETS[i].mesh||(SHEETS[i].mesh=finalize(SHEETS[i]));

  st.done=Math.min(sv.done||0,M.order.length);st.ops=Array.isArray(sv.ops)?sv.ops.filter(o=>o&&o.f<M.F.length&&(o.f>=0||o.pl)):[];

/* ---------- projection ---------- */
function project(){
  const ca=Math.cos(st.yaw),sa=Math.sin(st.yaw),cb=Math.cos(st.pitch),sb=Math.sin(st.pitch);
  R0=[ca,0,sa];R1=[sa*sb,cb,-ca*sb];R2=[-sa*cb,sb,ca*cb];
  S=Math.min(W,H)*0.34*st.zoom;cx=W/2;cy=H/2-(W>900?0:20);
  M.P.forEach((p,i)=>{SX[i]=cx+S*dot(p,R0);SY[i]=cy-S*dot(p,R1);SZ[i]=dot(p,R2);});
  for(const f of M.F){f.nw=dot(f.n,R2);f.d=dot(f.o,R2);f.ox=cx+S*dot(f.o,R0);f.oy=cy-S*dot(f.o,R1);
    f.ux=S*dot(f.u,R0);f.uy=-S*dot(f.u,R1);f.vx=S*dot(f.w,R0);f.vy=-S*dot(f.w,R1);
    f.du=dot(f.u,R2);f.dv=dot(f.w,R2);f.det=f.ux*f.vy-f.uy*f.vx;}

      for(let i=0;i<M.P.length;i++)VIS[i]=M.rank[i]>=0&&visible(i);}
    drawPath(1);drawDots(1,now);}
  else if(st.mode==='reveal'){const t=Math.min(1,(now-st.revealAt)/1700),e=t*t*(3-2*t);
    drawShadow(e);drawSolid(e);drawPath(1-e);for(let i=0;i<M.P.length;i++)VIS[i]=true;drawDots(1-e,now);
    if(t>=1){st.mode='colour';hud();}}
  else{drawPlaneCue();drawFree(true);drawShadow(1);drawSolid(1);drawFree(false);drawDims(1);}
  const az=((Math.round(st.yaw*180/Math.PI)%360)+360)%360,el=Math.round(st.pitch*180/Math.PI);
  $('tbView').textContent=az+'° / '+el+'°';
}
function loop(now){
  if(view.t0){const t=Math.min(1,(now-view.t0)/320),e=t*t*(3-2*t);st.yaw=view.y0+(view.y1-view.y0)*e;st.pitch=view.p0+(view.p1-view.p0)*e;if(t>=1)view.t0=0;dirty=true;}
  const busy=st.mode==='reveal'||now<animUntil||view.t0||(st.mode==='connect'&&st.done>0);
  if(dirty||busy){dirty=false;render(now);}
  requestAnimationFrame(loop);
}
function resize(){const r=cv.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,3);W=r.width;H=r.height;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);dirty=true;}

/* ---------- HUD ---------- */
let toastTimer=0;
function toast(msg,ms=3600){const t=$('toast');t.textContent=msg;t.dataset.show='1';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.dataset.show='0',ms);}
function hud(){
  const s=SHEETS[st.sheet],N=M.order.length,solved=st.done===N,p=n=>String(n).padStart(2,'0');
  $('connectBar').hidden=st.mode!=='connect';$('colourBar').hidden=st.mode!=='colour';
  $('nextNo').textContent=Math.min(st.done+1,N);$('nextOf').textContent='of '+N;
  $('btnBack').disabled=st.done===0;
  $('tbName').textContent=solved?s.name:'Unidentified';$('tbNo').textContent=s.no;$('tbPts').textContent=st.done+' / '+N;$('tbBar').style.width=(st.done/N*100)+'%';
  $('tbStatus').textContent=st.mode==='colour'?'Colouring':st.mode==='reveal'?'Resolved':'Connecting';
  document.querySelectorAll('[data-plane]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.plane===st.plane));
  $('btnSound').setAttribute('aria-pressed',snd.on);$('btnSound').innerHTML=ICON[snd.on?'sound':'mute'];
  $('hatchKinds').hidden=st.tool!=='hatch';$('sizeWrap').hidden=!drawing();
  document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===st.tool));
  document.querySelectorAll('[data-hatch]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.hatch===st.hatch));
  document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===st.colour));
  cv.style.cursor=st.mode==='colour'&&st.tool==='orbit'?'grab':'crosshair';
  const list=$('sheetList');list.textContent='';
  SHEETS.forEach((sh,i)=>{const sv=i===st.sheet?{done:st.done}:(store.get('sheet:'+sh.id)||{});
    const n=(sh.mesh||(sh.mesh=finalize(sh))).order.length,ok=(sv.done||0)>=n;
    const b=document.createElement('button');b.className='sheet';b.setAttribute('aria-current',i===st.sheet);
    b.innerHTML='<b></b><span><em></em><br><small></small></span><small class="st"></small>';
    b.children[0].textContent=sh.no;b.querySelector('em').textContent=ok?sh.name:'Unidentified';
    b.querySelector('span small').textContent=(sh.cat||'Object')+' · '+n+' dots';b.children[2].textContent=ok?'Done':(sv.done?sv.done+' / '+n:'New');b.children[2].classList.toggle('ok',ok);
    b.onclick=()=>{loadSheet(i);toggleDrawer(false);};list.appendChild(b);});
  dirty=true;
}
function toggleDrawer(open){const d=$('drawer');d.hidden=open===undefined?!d.hidden:!open;$('btnSheets').setAttribute('aria-expanded',!d.hidden);resetArm(false);}

/* ---------- sound: everything is synthesised, no audio files ---------- */
const snd={on:store.get('sound')!==false,ac:null};
function audio(){if(!snd.on)return null;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  if(!snd.ac){try{const ac=snd.ac=new AC(),sr=ac.sampleRate,n=sr*3,buf=snd.buf=ac.createBuffer(1,n,sr),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*.5;
    const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
    const hp=snd.bp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=1500;hp.Q.value=.6;
    const pk=ac.createBiquadFilter();pk.type='peaking';pk.frequency.value=4000;pk.Q.value=.7;pk.gain.value=5;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=8000;
    const g=snd.sg=ac.createGain();g.gain.value=0;src.connect(hp);hp.connect(pk);pk.connect(lp);lp.connect(g);g.connect(ac.destination);src.start();
  }catch(e){snd.ac=null;return null;}}
  if(snd.ac.state==='suspended')snd.ac.resume().catch(()=>{});return snd.ac;}
/* pencil on paper: filtered noise whose loudness and brightness follow the speed of the nib */
/* The pencil hiss is one continuous sound. Stroke speed is smoothed and the volume is nudged on a
   steady clock, so jitter in the pointer events never reaches the ear as rattle. */
function scratch(speed,press){if(!audio())return;snd.sp=(snd.sp||0)*.8+Math.min(3,speed)*.2;snd.pr=press||.6;snd.last=performance.now();
  if(!snd.timer)snd.timer=setInterval(()=>{const idle=performance.now()-snd.last,t=snd.ac.currentTime;
    if(idle>80)snd.sp*=.55;
    const v=snd.sp<.015?0:Math.min(.4,.07+snd.sp*.2)*(.55+.9*snd.pr);
    snd.sg.gain.setTargetAtTime(v,t,.07);snd.bp.frequency.setTargetAtTime(1400+Math.min(700,snd.sp*350),t,.2);
    if(idle>700){clearInterval(snd.timer);snd.timer=0;snd.sg.gain.setTargetAtTime(0,t,.05);}},40);}
function hush(){snd.sp=0;if(snd.ac)snd.sg.gain.setTargetAtTime(0,snd.ac.currentTime,.08);}
function burst(dur,vol,freq){const ac=audio();if(!ac)return;const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=snd.buf;f.type='bandpass';f.frequency.value=freq;f.Q.value=.8;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t,Math.random());s.stop(t+dur+.02);}
function tick(f,vol=.22){const ac=audio();if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.45,t+.05);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.1);
  burst(.03,.12,3500);}
const swish=()=>burst(.22,.14,1800);
const chime=()=>[0,4,7,12].forEach((n,i)=>setTimeout(()=>tick(660*Math.pow(2,n/12),.16),120+i*95));

/* ---------- interaction ---------- */
function connect(){
  st.done++;st.locateAt=0;save();tick(1100+900*st.done/M.order.length);
  if(st.done===M.order.length){st.rubber=null;st.mode='reveal';st.revealAt=performance.now();chime();toast(SHEETS[st.sheet].no+' resolved: '+SHEETS[st.sheet].name+'. Now colour it in.',4200);}
  hud();
}
function dotAt(x,y,r){let best=-1,bd=r*r;for(let i=0;i<M.P.length;i++){if(M.rank[i]<0||(!VIS[i]&&M.rank[i]!==st.done-1))continue;
  const d=(SX[i]-x)**2+(SY[i]-y)**2;if(d<bd){bd=d;best=i;}}return best;}
const ptrs=new Map();let drag=null,pinch=null;const view={t0:0};
function pos(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
function pushOp(o){st.ops.push(o);if(o.f<0)freeOps.push(o);else if(o.k==='clear')faceOps[o.f]=[];else faceOps[o.f].push(o);dirty=true;}
const drawing=()=>st.tool==='marker'||st.tool==='pencil';
/* stroke width in model units: the marker is a broad nib, the pencil a fine point */
const nib=()=>+((st.tool==='pencil'?1.2+$('size').value*.05:+$('size').value)/S).toFixed(4);
/* Stylus feel. Pressure: the marker spreads, the pencil gets darker and a little heavier.
   Tilt: past a normal writing angle the marker lays down a broad chisel stroke, and the pencil
   shades wide and soft with the side of the lead. Returns [width multiplier, darkness multiplier]. */
function penFeel(e){
  const pr=e.pressure>0?Math.min(1,e.pressure):.5;let t=0;
  if(typeof e.altitudeAngle==='number')t=1-e.altitudeAngle/(Math.PI/2);
  else if(e.tiltX||e.tiltY){const m=Math.hypot(Math.tan(e.tiltX*Math.PI/180),Math.tan(e.tiltY*Math.PI/180));t=1-Math.atan(1/m)/(Math.PI/2);}
  const lean=Math.max(0,Math.min(1,(t-.45)/.4));
  let w,a;if(st.tool==='pencil'){w=(.6+.9*pr)*(1+7*lean*lean);a=(.25+.95*pr)*(1-.55*lean);}else{w=(.45+1.1*pr)*(1+1.3*lean);a=1;}
  if(drag.sw){w=drag.sw=drag.sw*.6+w*.4;a=drag.sa=drag.sa*.6+a*.4;}else{drag.sw=w;drag.sa=a;}
  drag.pr=pr;return [+w.toFixed(2),+a.toFixed(2)];}
function paintAt(x,y,e){
  const stylus=e&&e.pointerType==='pen',mk=f=>{const o={f,k:'stroke',c:st.colour,w:nib(),pen:st.tool==='pencil'?1:0,al:drag.al,pts:[],g:opGroup};
    if(stylus&&o.pen){o.pw=[];o.pa=[];}return o;};
  let a,b;
  if(drag.pl){const q=planeHit(drag.pl,x,y);if(!q)return;
    if(!drag.op){drag.op=mk(-1);drag.op.pl=drag.pl.pl;pushOp(drag.op);}a=q[0];b=q[1];}
  else{const h=pickFace(x,y);if(!h){drag.op=null;return;}
    if(!drag.op||drag.op.f!==h.fi){drag.op=mk(h.fi);pushOp(drag.op);}a=h.a;b=h.b;}
  const o=drag.op;o.pts.push(+a.toFixed(3),+b.toFixed(3));
  if(o.pw){const f=penFeel(e);o.pw.push(f[0]);if(o.pa)o.pa.push(f[1]);}
  dirty=true;
}
cv.addEventListener('pointerdown',e=>{
  if(!$('drawer').hidden)toggleDrawer(false);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const [x,y]=pos(e);ptrs.set(e.pointerId,[x,y]);if(e.pointerType==='pen')st.penSeen=true;view.t0=0;
  if(ptrs.size===2){if(drag&&drag.type==='paint'&&drag.op)save();drag=null;st.rubber=null;const p=[...ptrs.values()];
    pinch={d:Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]),zoom:st.zoom,mx:(p[0][0]+p[1][0])/2,my:(p[0][1]+p[1][1])/2};return;}
  if(ptrs.size>2)return;
  const orbit={type:'orbit',x,y};
  if(st.mode==='connect'){
    const i=dotAt(x,y,e.pointerType==='mouse'?16:26);
    if(i>=0){const k=M.rank[i];
      if(k===st.done&&VIS[i]){connect();drag={type:'draw'};st.rubber=[x,y];}
      else if(k===st.done-1){drag={type:'draw'};st.rubber=[x,y];}
      else if(k>st.done){tick(240,.2);st.wrong={i,at:performance.now()};animUntil=performance.now()+500;drag=null;}
      else drag=orbit;
    }else drag=orbit;
  }else if(st.mode==='colour'){
    const al=+$('alpha').value/100;
    const wantsOrbit=st.tool==='orbit'||e.button===2||e.shiftKey||(e.pointerType==='touch'&&st.penSeen);
    const w=!wantsOrbit&&st.plane!=='form'&&(drawing()||st.tool==='fill')?workPlane():null;
    if(w){const q=planeHit(w,x,y),r=w.rect;drag=null;
      if(!q)toast(st.plane==='ground'?'The ground is edge-on from here. Tilt the view to draw on it.':'The backdrop is edge-on from here. Lower the view to draw on it.',2800);
      else if(drawing()){opGroup++;drag={type:'paint',op:null,pl:w,al,px:x,py:y,pt:e.timeStamp};paintAt(x,y,e);scratch(.4,drag.pr);}
      else if(q[0]>=r[0]&&q[0]<=r[2]&&q[1]>=r[1]&&q[1]<=r[3]){opGroup++;pushOp({f:-1,k:'fill',c:st.colour,al,pl:w.pl,rect:r,g:opGroup});swish();save();}
    }else{
      const h=wantsOrbit?null:pickFace(x,y);
      if(!h)drag=orbit;
      else if(drawing()){opGroup++;drag={type:'paint',op:null,al,px:x,py:y,pt:e.timeStamp};paintAt(x,y,e);scratch(.4,drag.pr);}
      else{opGroup++;pushOp(st.tool==='fill'?{f:h.fi,k:'fill',c:st.colour,al,g:opGroup}:st.tool==='hatch'?{f:h.fi,k:'hatch',c:st.colour,al,p:st.hatch,g:opGroup}:{f:h.fi,k:'clear',g:opGroup});swish();save();drag=null;}
    }
  }else drag=orbit;
  dirty=true;
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const [x,y]=pos(e);ptrs.set(e.pointerId,[x,y]);
  if(pinch&&ptrs.size===2){const p=[...ptrs.values()],d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]),mx=(p[0][0]+p[1][0])/2,my=(p[0][1]+p[1][1])/2;
    st.zoom=Math.max(.5,Math.min(4,pinch.zoom*d/pinch.d));turn(mx-pinch.mx,my-pinch.my);pinch.mx=mx;pinch.my=my;dirty=true;return;}
  if(!drag)return;
  if(drag.type==='orbit'){turn(x-drag.x,y-drag.y);drag.x=x;drag.y=y;}
  else if(drag.type==='draw'){st.rubber=[x,y];
    if(st.mode==='connect'&&st.done<M.order.length){const n=M.order[st.done];if(VIS[n]&&Math.hypot(SX[n]-x,SY[n]-y)<(e.pointerType==='mouse'?12:18))connect();}}
  else if(drag.type==='paint'){const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const c of (evs.length?evs:[e])){const q=pos(c);paintAt(q[0],q[1],c);}
    const sp=Math.hypot(x-drag.px,y-drag.py)/Math.max(1,e.timeStamp-drag.pt);drag.px=x;drag.py=y;drag.pt=e.timeStamp;if(drag.op&&sp>.01)scratch(sp,drag.pr);}
  dirty=true;
});
function up(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  audio();if(drag&&drag.type==='paint'){save();hush();}if(ptrs.size===0){drag=null;st.rubber=null;}dirty=true;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();st.zoom=Math.max(.5,Math.min(4,st.zoom*Math.exp(-e.deltaY*.0015)));dirty=true;},{passive:false});
function turn(dx,dy){st.yaw+=dx*.008;st.pitch=Math.max(-Math.PI/2,Math.min(Math.PI/2,st.pitch+dy*.008));}

document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{
  const v={iso:ISO,top:[0,Math.PI/2],front:[0,0],side:[Math.PI/2,0]}[b.dataset.view];
  let y0=st.yaw%(2*Math.PI);if(y0-v[0]>Math.PI)y0-=2*Math.PI;if(v[0]-y0>Math.PI)y0+=2*Math.PI;
  Object.assign(view,{t0:performance.now(),y0,y1:v[0],p0:st.pitch,p1:v[1]});});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{st.tool=b.dataset.tool;hud();});
document.querySelectorAll('[data-hatch]').forEach(b=>b.onclick=()=>{st.hatch=b.dataset.hatch;hud();});
PALETTE.forEach(c=>{const b=document.createElement('button');b.className='sw';b.dataset.c=c;b.style.background=c;b.setAttribute('aria-label','Colour '+c);
  b.onclick=()=>{st.colour=c;if(st.tool==='wipe'||st.tool==='orbit')st.tool='marker';hud();};$('swatches').appendChild(b);});
$('btnSheets').onclick=()=>toggleDrawer();
document.querySelectorAll('[data-plane]').forEach(b=>b.onclick=()=>{st.plane=b.dataset.plane;if(st.plane!=='form'&&st.tool!=='fill'&&!drawing())st.tool='marker';hud();
  if(st.plane==='ground')toast('Drawing on the ground plane. Marker and Fill now land on the datum grid under the form.',3600);
  if(st.plane==='wall')toast('Drawing on the backdrop: an upright sheet behind the form. Rotate to pick a different side.',3800);});
$('btnSound').onclick=()=>{snd.on=!snd.on;store.set('sound',snd.on);if(snd.on)tick(1500);else hush();hud();};
$('btnLocate').onclick=()=>{st.locateAt=performance.now();animUntil=st.locateAt+2300;
  if(st.done<M.order.length&&!VIS[M.order[st.done]])toast('Dot '+String(st.done+1).padStart(2,'0')+' is behind the form. Rotate until it comes round.',2600);};
$('btnBack').onclick=()=>{if(st.done>0){st.done--;save();hud();}};
$('btnUndo').onclick=()=>{if(!st.ops.length)return;const g=st.ops[st.ops.length-1].g;while(st.ops.length&&st.ops[st.ops.length-1].g===g)st.ops.pop();rebuildOps();save();dirty=true;};
$('btnClear').onclick=()=>{opGroup++;let any=false;faceOps.forEach((l,f)=>{if(l.length){any=true;st.ops.push({f,k:'clear',g:opGroup});}});
  if(freeOps.length){any=true;st.ops.push({f:-1,k:'clear',g:opGroup});}
  if(any){rebuildOps();save();dirty=true;toast('Colour cleared. Undo brings it back.',2200);}};
let armed=0;
function resetArm(on){clearTimeout(armed);armed=0;const b=$('btnReset');b.textContent=on?'Tap again to erase':'Reset this sheet';b.classList.toggle('go',!!on);if(on)armed=setTimeout(()=>resetArm(false),3000);}
$('btnReset').onclick=()=>{if(!armed){resetArm(true);return;}resetArm(false);st.done=0;st.ops=[];st.mode='connect';rebuildOps();save();hud();toggleDrawer(false);};
$('btnTheme').onclick=()=>{const root=document.documentElement,dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme=dark?'light':'dark';store.set('theme',root.dataset.theme);readColours();};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColours);
new MutationObserver(readColours).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
window.addEventListener('resize',resize);

/* ---------- boot ---------- */
const th=store.get('theme');if(th==='dark'||th==='light')document.documentElement.dataset.theme=th;
opGroup=1e6+Math.floor(performance.now());
readColours();resize();loadSheet(Math.min(SHEETS.length-1,Math.max(0,store.get('last')|0)));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>dirty=true);
if(st.done===0)toast('Tap dot 01 to start, then draw from the live dot to the next number. Drag empty space to rotate; pinch to zoom.',6500);
requestAnimationFrame(loop);
window.__datum={st,SHEETS,mesh:()=>M,load:loadSheet,connect,visible:i=>VIS[i]};
})();
</script>
