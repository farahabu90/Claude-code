<meta name="claude:viewport-fit-sides" content="cover">
<title>Datum Drafting Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one full-bleed drawing sheet (canvas); drafting-label panels pinned to its four corners. */
:root{
  --paper:#E4EAEC;   /* drafting film */
  --panel:#F2F5F6;   /* label stock */
  --ink:#17283A;     /* technical pen */
  --muted:#5B6B7A;
  --grid:#B5C4CD;
  --face:#F8FAFB;    /* resolved surface before colour */
  --accent:#D2382C;  /* redline pencil */
  --on-accent:#FFFFFF;
  --hand:"Architects Daughter","Bradley Hand","Segoe Print",cursive;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gx:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14407A; --panel:#0F3363; --ink:#EAF3FB; --muted:#A9C3E0; --grid:#3A66A0;
    --face:#1B4E90; --accent:#FFD23F; --on-accent:#0F2A4F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14407A; --panel:#0F3363; --ink:#EAF3FB; --muted:#A9C3E0; --grid:#3A66A0;
  --face:#1B4E90; --accent:#FFD23F; --on-accent:#0F2A4F; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:12px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}

.corner{position:absolute;display:flex;gap:8px;z-index:2}
.tl{top:12px;left:var(--gx);align-items:stretch}
.tr{top:12px;right:var(--gr);flex-wrap:wrap;justify-content:flex-end}
.bl{bottom:12px;left:var(--gx);right:var(--gr);pointer-events:none;align-items:flex-end}
.bl > *{pointer-events:auto}
.br{bottom:12px;right:var(--gr)}

.panel{background:var(--panel);border:1.5px solid var(--ink)}
.brand{display:flex;flex-direction:column;justify-content:center;padding:4px 12px 2px}
.brand b{font-family:var(--hand);font-size:24px;line-height:1;font-weight:400;letter-spacing:.04em}
.brand span{font-size:9px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}

button{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  background:var(--panel);border:1.5px solid var(--ink);border-radius:0;min-height:40px;min-width:44px;
  padding:0 12px;cursor:pointer;touch-action:manipulation}
button:hover{background:var(--paper)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
button.go{background:var(--accent);color:var(--on-accent);border-color:var(--ink)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;max-width:100%}
.next{display:flex;align-items:baseline;gap:8px;padding:0 6px}
.next small{font-size:9px;letter-spacing:.16em;color:var(--muted)}
.next b{font:400 30px/1 var(--hand);font-variant-numeric:tabular-nums;min-width:1.4em;text-align:center}
.next i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.group{display:flex;gap:0}
.group button + button{border-left:0}
.swatches{display:flex;flex-wrap:wrap;gap:4px;max-width:330px}
.sw{min-width:0;min-height:0;width:26px;height:26px;padding:0;border:1.5px solid var(--ink)}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.size{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.16em;color:var(--muted)}
.size input{width:90px;accent-color:var(--accent)}

#tb{display:grid;grid-template-columns:auto auto;min-width:250px}
#tb div{padding:5px 9px;border-bottom:1px solid var(--ink);border-right:1px solid var(--ink)}
#tb div:nth-child(even){border-right:0}
#tb div:nth-last-child(-n+2){border-bottom:0}
#tb small{display:block;font-size:8px;letter-spacing:.18em;color:var(--muted);margin-bottom:2px}
#tb span{font-variant-numeric:tabular-nums;letter-spacing:.04em}
#tb .wide{grid-column:1/-1;border-right:0}
#tb .wide span{font:400 20px/1.1 var(--hand)}

#drawer{position:absolute;z-index:3;top:66px;left:var(--gx);width:min(320px,calc(100% - var(--gx) - var(--gr)));
  max-height:calc(100% - 90px);overflow:auto;display:flex;flex-direction:column}
#drawer h2{margin:0;padding:8px 12px;font:500 10px var(--mono);letter-spacing:.18em;border-bottom:1.5px solid var(--ink)}
#drawer .sheet{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;text-align:left;
  border:0;border-bottom:1px solid var(--ink);min-height:52px;text-transform:none;letter-spacing:.02em}
#drawer .sheet b{font-weight:600;letter-spacing:.08em}
#drawer .sheet em{font:400 17px var(--hand);font-style:normal}
#drawer .sheet small{font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
#drawer .sheet[aria-current="true"]{background:var(--ink);color:var(--panel)}
#drawer .sheet[aria-current="true"] small{color:var(--panel)}
#drawer .foot{padding:8px;display:flex;gap:8px}
#drawer .foot button{flex:1}

#toast{position:absolute;z-index:4;left:50%;top:70px;transform:translateX(-50%);max-width:min(520px,calc(100% - 32px));
  padding:9px 14px;text-align:center;line-height:1.5;letter-spacing:.04em;pointer-events:none;transition:opacity .3s}
#toast[data-show="0"]{opacity:0}

@media (max-width:900px){ #tb{display:none} }
@media (min-width:901px){ .bl{right:calc(var(--gr) + 270px)} }
@media (max-width:640px){
  .tr{flex-direction:column;align-items:flex-end;gap:0}
  .tr .group{flex-direction:column}
  .tr .group button + button{border-left:1.5px solid var(--ink);border-top:0}
  .tr > button{border-top:0}
  .swatches{max-width:100%}
}
@media (prefers-reduced-motion: reduce){ #toast{transition:none} }
</style>

<div id="app">
  <canvas id="cv" aria-label="Drawing sheet. Connect the numbered dots in order; rotate the view to find hidden ones."></canvas>

  <div class="corner tl">
    <div class="panel brand"><b>Datum</b><span>3D dot-to-dot drafting book</span></div>
    <button id="btnSheets" aria-expanded="false" aria-controls="drawer">Sheets</button>
  </div>

  <div class="corner tr">
    <div class="group" id="viewGroup" role="group" aria-label="Standard views">
      <button data-view="iso">Iso</button><button data-view="top">Top</button><button data-view="front">Front</button><button data-view="side">Side</button>
    </div>
    <button id="btnTheme" title="Switch between drafting film and blueprint">Paper</button>
    <button id="btnSound" aria-pressed="true" title="Pencil and click sounds">Sound</button>
  </div>

  <div class="corner bl">
    <div class="panel bar" id="connectBar">
      <div class="next"><small>NEXT DOT</small><b id="nextNo">01</b><i id="nextOf">/ 00</i></div>
      <button id="btnLocate">Locate</button>
      <button id="btnBack">Step back</button>
    </div>
    <div class="panel bar" id="colourBar" hidden>
      <div class="group" role="group" aria-label="Tool">
        <button data-tool="marker" aria-pressed="true">Marker</button><button data-tool="pencil">Pencil</button><button data-tool="fill">Fill</button><button data-tool="hatch">Hatch</button><button data-tool="wipe">Wipe</button><button data-tool="orbit">Orbit</button>
      </div>
      <div class="swatches" id="swatches" role="group" aria-label="Colour"></div>
      <div class="group" id="hatchKinds" role="group" aria-label="Hatch pattern" hidden>
        <button data-hatch="diag" aria-pressed="true">Diag</button><button data-hatch="cross">Cross</button><button data-hatch="lines">Lines</button><button data-hatch="stipple">Stipple</button>
      </div>
      <label class="size" id="sizeWrap" for="size">NIB <input id="size" type="range" min="4" max="44" value="16"></label>
      <label class="size" for="alpha">OPACITY <input id="alpha" type="range" min="10" max="100" value="80"></label>
      <div class="group" id="planeKinds" role="group" aria-label="Surface to draw on">
        <button data-plane="form" aria-pressed="true">Form</button><button data-plane="ground">Ground</button><button data-plane="wall">Backdrop</button>
      </div>
      <div class="group"><button id="btnUndo">Undo</button><button id="btnClear">Clear</button></div>
    </div>
  </div>

  <aside class="corner br panel" id="tb" aria-label="Title block">
    <div class="wide"><small>PROJECT</small><span id="tbName">Unidentified</span></div>
    <div><small>DWG NO.</small><span id="tbNo">A-01</span></div>
    <div><small>POINTS</small><span id="tbPts">0 / 0</span></div>
    <div><small>VIEW AZ / EL</small><span id="tbView">315° / 35°</span></div>
    <div><small>STATUS</small><span id="tbStatus">Setting out</span></div>
  </aside>

  <div id="drawer" class="panel" hidden>
    <h2>SHEET INDEX</h2>
    <div id="sheetList"></div>
    <div class="foot"><button id="btnReset">Reset this sheet</button></div>
  </div>

  <div id="toast" class="panel" role="status" data-show="0"></div>
</div>

<script>
(() => {
'use strict';
/* ---------- vector helpers ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]), unit=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l,a[2]/l];};

function inPoly(L,x,y){let c=false;for(let i=0,j=L.length-1;i<L.length;j=i++){const a=L[i],b=L[j];
  if((a[1]>y)!==(b[1]>y) && x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]) c=!c;}return c;}

/* ---------- mesh building ---------- */
/* A vertex is a numbered dot only if it was placed while m.dot was on; detail parts and insets
   add geometry that appears when the drawing resolves, without adding dots. */
function mesh(){return {P:[],F:[],D:[],keys:new Map(),dot:true,detail:false};}
function vid(m,p){const k=p.map(n=>Math.round(n*1e4)).join(',');let i=m.keys.get(k);
  if(i===undefined){i=m.P.length;m.P.push(p.slice());m.D.push(false);m.keys.set(k,i);}if(m.dot)m.D[i]=true;return i;}
function face(m,pts,sheet,decal){let v=pts.map(p=>vid(m,p)).filter((id,i,a)=>id!==a[(i+1)%a.length]);
  if(v.length>=3) m.F.push({v,sheet:!!sheet,decal:!!decal,occ:!m.detail&&!decal});}
function detail(m,fn){const d=m.dot;m.dot=false;m.detail=true;fn();m.dot=d;m.detail=false;}
/* a panel (window, door) drawn on part of a wall quad q; u runs along q[0]->q[1], v along q[0]->q[3] */
function inset(m,q,u0,u1,v0,v1,out){const L=(a,b,t)=>add(mul(a,1-t),mul(b,t)),P=(u,v)=>L(L(q[0],q[1],u),L(q[3],q[2],u),v);
  let pts=[P(u0,v0),P(u1,v0),P(u1,v1),P(u0,v1)],n=unit(cross(sub(pts[1],pts[0]),sub(pts[3],pts[0])));
  if(!out){const c=mul(add(add(q[0],q[1]),add(q[2],q[3])),.25);out=[c[0],0,c[2]];}
  if(dot(n,out)<0){pts.reverse();n=mul(n,-1);}
  const d=m.dot;m.dot=false;face(m,pts.map(p=>add(p,mul(n,.008))),false,true);m.dot=d;}
const wallQ=(x0,z0,x1,z1,y0,y1)=>[[x0,y0,z0],[x1,y0,z1],[x1,y1,z1],[x0,y1,z0]];
const ringQ=(R,k,i)=>{const j=(i+1)%R[k].length;return [R[k][i],R[k][j],R[k+1][j],R[k+1][i]];};
function newell(m,v){let n=[0,0,0];for(let i=0;i<v.length;i++){const a=m.P[v[i]],b=m.P[v[(i+1)%v.length]];
  n[0]+=(a[1]-b[1])*(a[2]+b[2]);n[1]+=(a[2]-b[2])*(a[0]+b[0]);n[2]+=(a[0]-b[0])*(a[1]+b[1]);}return unit(n);}
function centroid(m,v){let c=[0,0,0];for(const i of v)c=add(c,m.P[i]);return mul(c,1/v.length);}
function geom(m,f){f.o=centroid(m,f.v);f.n=newell(m,f.v);f.u=unit(sub(m.P[f.v[1]],m.P[f.v[0]]));f.w=cross(f.n,f.u);
  f.L=f.v.map(i=>{const d=sub(m.P[i],f.o);return [dot(d,f.u),dot(d,f.w)];});}
/* A closed solid: after building, flip any face whose normal points into the solid (ray parity test). */
function solid(m,build){const from=m.F.length;build();const fs=m.F.slice(from);fs.forEach(f=>geom(m,f));
  const D=unit([0.3713,0.8291,0.4177]);
  for(const f of fs){const p=add(f.o,mul(f.n,1e-3));let hits=0;
    for(const g of fs){const dn=dot(D,g.n);if(Math.abs(dn)<1e-9)continue;const t=dot(sub(g.o,p),g.n)/dn;if(t<=1e-9)continue;
      const h=sub(add(p,mul(D,t)),g.o);if(inPoly(g.L,dot(h,g.u),dot(h,g.w)))hits++;}
    if(hits&1)f.v.reverse();}}
function lathe(m,rings,sides,phase=0,ox=0,oz=0){
  const R=rings.map(([r,y])=>Array.from({length:sides},(_,i)=>{const t=phase+i/sides*2*Math.PI;return [ox+r*Math.cos(t),y,oz+r*Math.sin(t)];}));
  const d=m.dot;rings.forEach((rg,k)=>{m.dot=d&&rg[2]!==0;R[k].forEach(p=>vid(m,p));});m.dot=false;
  solid(m,()=>{const last=R.length-1;
    if(rings[0][0]>0)face(m,R[0]);
    for(let k=0;k<last;k++)for(let i=0;i<sides;i++){const j=(i+1)%sides;face(m,[R[k][i],R[k][j],R[k+1][j],R[k+1][i]]);}
    if(rings[last][0]>0)face(m,R[last]);});
  m.dot=d;return R;}
function box(m,x0,x1,y0,y1,z0,z1){const p=(x,y,z)=>[x,y,z];solid(m,()=>{
  face(m,[p(x0,y0,z0),p(x1,y0,z0),p(x1,y0,z1),p(x0,y0,z1)]);face(m,[p(x0,y1,z0),p(x1,y1,z0),p(x1,y1,z1),p(x0,y1,z1)]);
  face(m,[p(x0,y0,z0),p(x1,y0,z0),p(x1,y1,z0),p(x0,y1,z0)]);face(m,[p(x0,y0,z1),p(x1,y0,z1),p(x1,y1,z1),p(x0,y1,z1)]);
  face(m,[p(x0,y0,z0),p(x0,y0,z1),p(x0,y1,z1),p(x0,y1,z0)]);face(m,[p(x1,y0,z0),p(x1,y0,z1),p(x1,y1,z1),p(x1,y1,z0)]);});}

/* ---------- the sheets ---------- */
const SHEETS=[
 {id:'boat',no:'A-01',name:'Sailing Dinghy',mm:2600,build(m){
   const bow=[1.3,.3,0],sr=[.5,.3,.42],ar=[-.9,.3,.36],al=[-.9,.3,-.36],sl=[.5,.3,-.42],kf=[.6,0,0],ka=[-.8,0,0];
   solid(m,()=>{face(m,[bow,sr,ar,al,sl]);face(m,[ar,al,ka]);
     face(m,[sr,ar,ka]);face(m,[sr,ka,kf]);face(m,[bow,sr,kf]);
     face(m,[sl,al,ka]);face(m,[sl,ka,kf]);face(m,[bow,sl,kf]);});
   const foot=[.1,.3,0],top=[.1,2.3,0],boom=[-.85,.55,0];
   face(m,[foot,top,boom],true);face(m,[top,bow,foot],true);}},
 {id:'gem',no:'A-02',name:'Brilliant-Cut Gem',mm:40,build(m){lathe(m,[[0,-1],[1,.15],[.6,.5]],8);}},
 {id:'cabin',no:'A-03',name:'Gabled Cabin',mm:4200,build(m){
   const X=.8,Z=.6,H=1,Rg=1.7;
   solid(m,()=>{const g=x=>[[x,0,-Z],[x,0,Z],[x,H,Z],[x,Rg,0],[x,H,-Z]];
     face(m,g(-X));face(m,g(X));
     face(m,[[-X,0,-Z],[X,0,-Z],[X,0,Z],[-X,0,Z]]);
     face(m,[[-X,0,Z],[X,0,Z],[X,H,Z],[-X,H,Z]]);face(m,[[-X,0,-Z],[X,0,-Z],[X,H,-Z],[-X,H,-Z]]);
     face(m,[[-X,H,Z],[X,H,Z],[X,Rg,0],[-X,Rg,0]]);face(m,[[-X,H,-Z],[X,H,-Z],[X,Rg,0],[-X,Rg,0]]);});
   box(m,X,X+.28,0,2.05,-.2,.2);}},
 {id:'zig',no:'A-04',name:'Stepped Ziggurat',mm:9000,build(m){
   lathe(m,[[1,0],[1,.36],[.72,.36],[.72,.72],[.44,.72],[.44,1.08]],4,Math.PI/4);}},
 {id:'rocket',no:'A-05',name:'Sounding Rocket',mm:6400,build(m){
   const R=lathe(m,[[.22,0],[.3,.25],[.36,.6],[.36,1.9],[0,2.7]],6);
   for(const i of [0,2,4]){const lo=R[2][i],hi=[lo[0],1.25,lo[2]],tip=[lo[0]*2.5,.02,lo[2]*2.5];face(m,[lo,hi,tip],true);}}},
 {id:'pine',no:'A-06',name:'Mountain Pine',mm:5200,build(m){
   lathe(m,[[.12,0],[.12,.4],[.7,.4],[.3,1],[.55,1],[.2,1.5],[.4,1.5],[0,2.15]],5);}},
 {id:'light',no:'A-07',name:'Harbour Lighthouse',mm:14000,build(m){
   lathe(m,[[.55,0],[.32,1.9],[.48,1.9],[.48,2],[.26,2],[.26,2.45],[.38,2.45],[0,2.85]],6);}},
 {id:'villa',no:'B-01',cat:'Architecture',name:'Cantilever Villa',mm:11000,build(m){
   box(m,-.9,.5,0,.6,-.5,.5);box(m,-.4,1.3,.6,1.2,-.6,.6);
   detail(m,()=>{box(m,1.1,1.2,0,.6,.42,.52);box(m,1.1,1.2,0,.6,-.52,-.42);
     box(m,-.46,1.36,1.2,1.26,-.66,.66);box(m,-.2,.1,1.26,1.56,-.15,.15);});
   const uf=wallQ(-.4,.6,1.3,.6,.6,1.2),ub=wallQ(-.4,-.6,1.3,-.6,.6,1.2),ue=wallQ(1.3,-.6,1.3,.6,.6,1.2);
   inset(m,uf,.06,.94,.35,.78,[0,0,1]);for(const u of [.08,.4,.72])inset(m,ub,u,u+.2,.35,.78,[0,0,-1]);
   inset(m,ue,.08,.49,.12,.88,[1,0,0]);inset(m,ue,.51,.92,.12,.88,[1,0,0]);
   const lf=wallQ(-.9,.5,.5,.5,0,.6),lw=wallQ(-.9,-.5,-.9,.5,0,.6),le=wallQ(.5,-.5,.5,.5,0,.6);
   inset(m,lf,.1,.55,.3,.8,[0,0,1]);inset(m,lf,.68,.86,0,.8,[0,0,1]);inset(m,lw,.2,.8,.3,.8,[-1,0,0]);inset(m,le,.15,.85,0,.85,[1,0,0]);}},
 {id:'temple',no:'B-02',cat:'Architecture',name:'Doric Temple',mm:16000,build(m){
   box(m,-1.5,1.5,0,.15,-.9,.9);box(m,-1.4,1.4,1.5,1.72,-.8,.8);
   solid(m,()=>{const g=x=>[[x,1.72,-.8],[x,1.72,.8],[x,2.2,0]];face(m,g(-1.4));face(m,g(1.4));
     face(m,[[-1.4,1.72,-.8],[1.4,1.72,-.8],[1.4,1.72,.8],[-1.4,1.72,.8]]);
     face(m,[[-1.4,1.72,.8],[1.4,1.72,.8],[1.4,2.2,0],[-1.4,2.2,0]]);face(m,[[-1.4,1.72,-.8],[1.4,1.72,-.8],[1.4,2.2,0],[-1.4,2.2,0]]);});
   detail(m,()=>{box(m,-1.42,1.42,.15,.3,-.82,.82);box(m,-.85,.85,.3,1.5,-.35,.35);
     const col=(x,z)=>lathe(m,[[.09,.3],[.075,1.5]],6,0,x,z);
     for(const x of [-1.25,1.25])for(const z of [-.6,-.2,.2,.6])col(x,z);
     for(const z of [-.6,.6])for(const x of [-.75,-.25,.25,.75])col(x,z);});
   inset(m,wallQ(.85,-.35,.85,.35,.3,1.5),.3,.7,0,.8,[1,0,0]);}},
 {id:'chapel',no:'B-03',cat:'Architecture',name:'Hillside Chapel',mm:15000,build(m){
   const X0=-1.2,X1=.6,Z=.45,H=.9,Rg=1.45;
   solid(m,()=>{const g=x=>[[x,0,-Z],[x,0,Z],[x,H,Z],[x,Rg,0],[x,H,-Z]];face(m,g(X0));face(m,g(X1));
     face(m,[[X0,0,-Z],[X1,0,-Z],[X1,0,Z],[X0,0,Z]]);

function finalize(s){
  const m=mesh();s.build(m);
  let lo=[1e9,1e9,1e9],hi=[-1e9,-1e9,-1e9];
  for(const p of m.P)for(let k=0;k<3;k++){lo[k]=Math.min(lo[k],p[k]);hi[k]=Math.max(hi[k],p[k]);}
  const c=mul(add(lo,hi),.5);let r=0;for(const p of m.P)r=Math.max(r,len(sub(p,c)));
  m.P=m.P.map(p=>mul(sub(p,c),1/r));m.F.forEach(f=>geom(m,f));
  m.ground=(lo[1]-c[1])/r;m.mm=s.mm/2;
  const n=m.P.length,F=m.F.length,adj=Array.from({length:n},()=>new Set());m.E=[];const seen=new Set();
  for(const f of m.F){if(!f.occ)continue;for(let i=0;i<f.v.length;i++){const a=f.v[i],b=f.v[(i+1)%f.v.length],k=a<b?a+'_'+b:b+'_'+a;
    if(!seen.has(k)){seen.add(k);m.E.push([a,b]);if(m.D[a]&&m.D[b]){adj[a].add(b);adj[b].add(a);}}}}
  m.incident=Array.from({length:n},()=>new Set());m.F.forEach((f,fi)=>f.v.forEach(i=>m.incident[i].add(fi)));
  /* each inset panel rides on the wall it lies against */
  m.F.forEach(f=>f.decals=[]);
  m.F.forEach((f,fi)=>{if(!f.decal)return;f.host=-1;m.F.forEach((h,hi)=>{if(f.host>=0||h.decal||dot(f.n,h.n)<.999)return;const d=sub(f.o,h.o);
    if(Math.abs(dot(d,h.n))<.03&&inPoly(h.L,dot(d,h.u),dot(d,h.w)))f.host=hi;});if(f.host>=0)m.F[f.host].decals.push(fi);});
  /* which side of face b's plane does face a sit on: used to draw faces back to front */
  m.side=new Int8Array(F*F);
  for(let a=0;a<F;a++)for(let b=0;b<F;b++){if(a===b)continue;const B=m.F[b];let mn=1e9,mx=-1e9;
    for(const i of m.F[a].v){const d=dot(sub(m.P[i],B.o),B.n);mn=Math.min(mn,d);mx=Math.max(mx,d);}
    m.side[a*F+b]=mx<=1e-4&&mn<-1e-4?-1:mn>=-1e-4&&mx>1e-4?1:0;}
  /* numbering: a walk along the edges that visits every dot once, where one exists */
  const dots=[];for(let i=0;i<n;i++)if(m.D[i])dots.push(i);const nd=dots.length;
  let start=dots[0];for(const i of dots)if(m.P[i][1]<m.P[start][1]-1e-6||(Math.abs(m.P[i][1]-m.P[start][1])<1e-6&&m.P[i][0]<m.P[start][0]))start=i;
  const vis=new Uint8Array(n),free=i=>{let d=0;for(const j of adj[i])if(!vis[j])d++;return d;};
  let path=[start],steps=0;vis[start]=1;
  const dfs=()=>{if(path.length===nd)return true;if(++steps>60000)return false;
    const cand=[...adj[path[path.length-1]]].filter(j=>!vis[j]).sort((a,b)=>free(a)-free(b));
    for(const j of cand){vis[j]=1;path.push(j);if(dfs())return true;path.pop();vis[j]=0;}return false;};
  if(!dfs()){vis.fill(0);path=[start];vis[start]=1;
    while(path.length<nd){const cur=path[path.length-1];let cand=[...adj[cur]].filter(j=>!vis[j]).sort((a,b)=>free(a)-free(b));
      let nx=cand[0];if(nx===undefined){let bd=1e9;for(const j of dots)if(!vis[j]){const d=len(sub(m.P[j],m.P[cur]));if(d<bd){bd=d;nx=j;}}}
      vis[nx]=1;path.push(nx);}}
  m.order=path;m.rank=new Int32Array(n).fill(-1);path.forEach((v,k)=>m.rank[v]=k);
  m.jump=path.map((v,k)=>k>0&&!adj[v].has(path[k-1]));
  return m;
}

function loadSheet(i){

function rebuildOps(){faceOps=M.F.map(()=>[]);freeOps=[];for(const o of st.ops){
  if(o.f<0){if(o.k==='clear')freeOps=[];else freeOps.push(o);}else if(o.k==='clear')faceOps[o.f]=[];else faceOps[o.f].push(o);}}

/* ---------- projection ---------- */
function project(){
  const ca=Math.cos(st.yaw),sa=Math.sin(st.yaw),cb=Math.cos(st.pitch),sb=Math.sin(st.pitch);

  M.P.forEach((p,i)=>{SX[i]=cx+S*dot(p,R0);SY[i]=cy-S*dot(p,R1);SZ[i]=dot(p,R2);});
  for(const f of M.F){f.nw=dot(f.n,R2);f.d=dot(f.o,R2);f.ox=cx+S*dot(f.o,R0);f.oy=cy-S*dot(f.o,R1);
    f.ux=S*dot(f.u,R0);f.uy=-S*dot(f.u,R1);f.vx=S*dot(f.w,R0);f.vy=-S*dot(f.w,R1);
    f.du=dot(f.u,R2);f.dv=dot(f.w,R2);f.det=f.ux*f.vy-f.uy*f.vx;}
}
function onFace(f,x,y){ if(Math.abs(f.nw)<0.02)return null;
  const dx=x-f.ox,dy=y-f.oy,a=(dx*f.vy-dy*f.vx)/f.det,b=(f.ux*dy-f.uy*dx)/f.det;
  return inPoly(f.L,a,b)?{a,b,depth:f.d+a*f.du+b*f.dv}:null;}

  if(h&&(!best||h.depth>best.depth)){best=h;best.fi=fi;}});return best;}

    for(let x=cx%step;x<W;x+=step){ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,H);}
    for(let y=cy%step;y<H;y+=step){ctx.moveTo(0,Math.round(y)+.5);ctx.lineTo(W,Math.round(y)+.5);}ctx.stroke();}
  ctx.globalAlpha=1;ctx.strokeStyle=col.ink;ctx.lineWidth=1.5;ctx.strokeRect(5.5,5.5,W-11,H-11);
  ctx.lineWidth=1;for(let x=cx%120;x<W;x+=120){line(x,5,x,13);line(x,H-13,x,H-5);}
  for(let y=cy%120;y<H;y+=120){line(5,y,13,y);line(W-13,y,W-5,y);}

  [['X',[1,0,0]],['Y',[0,1,0]],['Z',[0,0,1]]].forEach(([n,a])=>{const x=tx+26*dot(a,R0),y=ty-26*dot(a,R1);

}

  ctx.beginPath();ctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);ctx.stroke();

function workPlane(){const E=1.15,g=M.ground,r=x=>+x.toFixed(3);
  if(st.plane==='ground')return {pl:[[0,r(g),0],[1,0,0],[0,0,1]],rect:[-E,-E,E,E]};
  const a=Math.round(st.yaw/(Math.PI/2))*Math.PI/2,hx=-Math.sin(a),hz=Math.cos(a);
  return {pl:[[r(-E*hx),r(g),r(-E*hz)],[r(Math.cos(a)),0,r(Math.sin(a))],[0,1,0]],rect:[-E,0,E,2*E]};}

      if(o.p==='cross')for(let c=x0+y0;c<x1+y1;c+=h){ctx.moveTo(c-y0,y0);ctx.lineTo(c-y1,y1);}

function drawSolid(alpha,clean){

    for(const v of f.v){f.bx0=Math.min(f.bx0,SX[v]);f.bx1=Math.max(f.bx1,SX[v]);f.by0=Math.min(f.by0,SY[v]);f.by1=Math.max(f.by1,SY[v]);}vis.push(i);});
