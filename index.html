<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Datum Drafting Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one full-bleed drawing sheet (canvas); drafting-label panels pinned to its four corners. */
:root{
  --paper:#E4EAEC;   /* drafting film */
  --panel:#F2F5F6;   /* label stock */
  --ink:#17283A;     /* technical pen */
  --muted:#5B6B7A;
  --grid:#B5C4CD;
  --face:#F8FAFB;    /* resolved surface before colour */
  --accent:#D2382C;  /* redline pencil */
  --on-accent:#FFFFFF;
  --hand:"Architects Daughter","Bradley Hand","Segoe Print",cursive;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gx:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14407A; --panel:#0F3363; --ink:#EAF3FB; --muted:#A9C3E0; --grid:#3A66A0;
    --face:#1B4E90; --accent:#FFD23F; --on-accent:#0F2A4F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14407A; --panel:#0F3363; --ink:#EAF3FB; --muted:#A9C3E0; --grid:#3A66A0;
  --face:#1B4E90; --accent:#FFD23F; --on-accent:#0F2A4F; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:12px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}

.corner{position:absolute;display:flex;gap:8px;z-index:2}
.tl{top:12px;left:var(--gx);align-items:stretch}
.tr{top:12px;right:var(--gr);flex-wrap:wrap;justify-content:flex-end}
.bl{bottom:12px;left:var(--gx);right:var(--gr);pointer-events:none;align-items:flex-end}
.bl > *{pointer-events:auto}
.br{bottom:12px;right:var(--gr)}

.panel{background:var(--panel);border:1.5px solid var(--ink)}
.brand{display:flex;flex-direction:column;justify-content:center;padding:4px 12px 2px}
.brand b{font-family:var(--hand);font-size:24px;line-height:1;font-weight:400;letter-spacing:.04em}
.brand span{font-size:9px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}

button{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  background:var(--panel);border:1.5px solid var(--ink);border-radius:0;min-height:40px;min-width:44px;
  padding:0 12px;cursor:pointer;touch-action:manipulation}
button:hover{background:var(--paper)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
button.go{background:var(--accent);color:var(--on-accent);border-color:var(--ink)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;max-width:100%}
.next{display:flex;align-items:baseline;gap:8px;padding:0 6px}
.next small{font-size:9px;letter-spacing:.16em;color:var(--muted)}
.next b{font:400 30px/1 var(--hand);font-variant-numeric:tabular-nums;min-width:1.4em;text-align:center}
.next i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.group{display:flex;gap:0}
.group button + button{border-left:0}
.swatches{display:flex;flex-wrap:wrap;gap:4px;max-width:330px}
.sw{min-width:0;min-height:0;width:26px;height:26px;padding:0;border:1.5px solid var(--ink)}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.size{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.16em;color:var(--muted)}
.size input{width:90px;accent-color:var(--accent)}

#tb{display:grid;grid-template-columns:auto auto;min-width:250px}
#tb div{padding:5px 9px;border-bottom:1px solid var(--ink);border-right:1px solid var(--ink)}
#tb div:nth-child(even){border-right:0}
#tb div:nth-last-child(-n+2){border-bottom:0}
#tb small{display:block;font-size:8px;letter-spacing:.18em;color:var(--muted);margin-bottom:2px}
#tb span{font-variant-numeric:tabular-nums;letter-spacing:.04em}
#tb .wide{grid-column:1/-1;border-right:0}
#tb .wide span{font:400 20px/1.1 var(--hand)}

#drawer{position:absolute;z-index:3;top:66px;left:var(--gx);width:min(320px,calc(100% - var(--gx) - var(--gr)));
  max-height:calc(100% - 90px);overflow:auto;display:flex;flex-direction:column}
#drawer h2{margin:0;padding:8px 12px;font:500 10px var(--mono);letter-spacing:.18em;border-bottom:1.5px solid var(--ink)}
#drawer .sheet{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;text-align:left;
  border:0;border-bottom:1px solid var(--ink);min-height:52px;text-transform:none;letter-spacing:.02em}
#drawer .sheet b{font-weight:600;letter-spacing:.08em}
#drawer .sheet em{font:400 17px var(--hand);font-style:normal}
#drawer .sheet small{font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
#drawer .sheet[aria-current="true"]{background:var(--ink);color:var(--panel)}
#drawer .sheet[aria-current="true"] small{color:var(--panel)}
#drawer .foot{padding:8px;display:flex;gap:8px}
#drawer .foot button{flex:1}

#toast{position:absolute;z-index:4;left:50%;top:70px;transform:translateX(-50%);max-width:min(520px,calc(100% - 32px));
  padding:9px 14px;text-align:center;line-height:1.5;letter-spacing:.04em;pointer-events:none;transition:opacity .3s}
#toast[data-show="0"]{opacity:0}

@media (max-width:900px){ #tb{display:none} }
@media (min-width:901px){ .bl{right:calc(var(--gr) + 270px)} }
@media (max-width:640px){
  .tr{flex-direction:column;align-items:flex-end;gap:0}
  .tr .group{flex-direction:column}
  .tr .group button + button{border-left:1.5px solid var(--ink);border-top:0}
  .tr > button{border-top:0}
  .swatches{max-width:100%}
}
@media (prefers-reduced-motion: reduce){ #toast{transition:none} }
</style>

<div id="app">
  <canvas id="cv" aria-label="Drawing sheet. Connect the numbered dots in order; rotate the view to find hidden ones."></canvas>

  <div class="corner tl">
    <div class="panel brand"><b>Datum</b><span>3D dot-to-dot drafting book</span></div>
    <button id="btnSheets" aria-expanded="false" aria-controls="drawer">Sheets</button>
  </div>

  <div class="corner tr">
    <div class="group" id="viewGroup" role="group" aria-label="Standard views">
      <button data-view="iso">Iso</button><button data-view="top">Top</button><button data-view="front">Front</button><button data-view="side">Side</button>
    </div>
    <button id="btnTheme" title="Switch between drafting film and blueprint">Paper</button>
    <button id="btnSound" aria-pressed="true" title="Pencil and click sounds">Sound</button>
  </div>

  <div class="corner bl">
    <div class="panel bar" id="connectBar">
      <div class="next"><small>NEXT DOT</small><b id="nextNo">01</b><i id="nextOf">/ 00</i></div>
      <button id="btnLocate">Locate</button>
      <button id="btnBack">Step back</button>
    </div>
    <div class="panel bar" id="colourBar" hidden>
      <div class="group" role="group" aria-label="Tool">
        <button data-tool="marker" aria-pressed="true">Marker</button><button data-tool="fill">Fill</button><button data-tool="hatch">Hatch</button><button data-tool="wipe">Wipe</button><button data-tool="orbit">Orbit</button>
      </div>
      <div class="swatches" id="swatches" role="group" aria-label="Colour"></div>
      <div class="group" id="hatchKinds" role="group" aria-label="Hatch pattern" hidden>
        <button data-hatch="diag" aria-pressed="true">Diag</button><button data-hatch="cross">Cross</button><button data-hatch="lines">Lines</button><button data-hatch="stipple">Stipple</button>
      </div>
      <label class="size" id="sizeWrap" for="size">NIB <input id="size" type="range" min="4" max="44" value="16"></label>
      <label class="size" for="alpha">OPACITY <input id="alpha" type="range" min="10" max="100" value="80"></label>
      <div class="group" id="layerKinds" role="group" aria-label="Draw behind or in front of the form" hidden>
        <button data-layer="back" aria-pressed="true">Behind</button><button data-layer="front">In front</button>
      </div>
      <div class="group"><button id="btnUndo">Undo</button><button id="btnClear">Clear</button></div>
      <button id="btnCanvas" class="go">To canvas</button>
    </div>
  </div>

  <aside class="corner br panel" id="tb" aria-label="Title block">
    <div class="wide"><small>PROJECT</small><span id="tbName">Unidentified</span></div>
    <div><small>DWG NO.</small><span id="tbNo">A-01</span></div>
    <div><small>POINTS</small><span id="tbPts">0 / 0</span></div>
    <div><small>VIEW AZ / EL</small><span id="tbView">315° / 35°</span></div>
    <div><small>STATUS</small><span id="tbStatus">Setting out</span></div>
  </aside>

  <div id="drawer" class="panel" hidden>
    <h2>SHEET INDEX</h2>
    <div id="sheetList"></div>
    <div class="foot"><button id="btnReset">Reset this sheet</button></div>
  </div>

  <div id="toast" class="panel" role="status" data-show="0"></div>
</div>

<script>
(() => {
'use strict';
/* ---------- vector helpers ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]), unit=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l,a[2]/l];};

function inPoly(L,x,y){let c=false;for(let i=0,j=L.length-1;i<L.length;j=i++){const a=L[i],b=L[j];
  if((a[1]>y)!==(b[1]>y) && x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]) c=!c;}return c;}

/* ---------- mesh building ---------- */
function mesh(){return {P:[],F:[],keys:new Map()};}
function vid(m,p){const k=p.map(n=>Math.round(n*1e4)).join(',');let i=m.keys.get(k);
  if(i===undefined){i=m.P.length;m.P.push(p.slice());m.keys.set(k,i);}return i;}
function face(m,pts,sheet){let v=pts.map(p=>vid(m,p)).filter((id,i,a)=>id!==a[(i+1)%a.length]);
  if(v.length>=3) m.F.push({v,sheet:!!sheet});}
function newell(m,v){let n=[0,0,0];for(let i=0;i<v.length;i++){const a=m.P[v[i]],b=m.P[v[(i+1)%v.length]];
  n[0]+=(a[1]-b[1])*(a[2]+b[2]);n[1]+=(a[2]-b[2])*(a[0]+b[0]);n[2]+=(a[0]-b[0])*(a[1]+b[1]);}return unit(n);}
function centroid(m,v){let c=[0,0,0];for(const i of v)c=add(c,m.P[i]);return mul(c,1/v.length);}
function geom(m,f){f.o=centroid(m,f.v);f.n=newell(m,f.v);f.u=unit(sub(m.P[f.v[1]],m.P[f.v[0]]));f.w=cross(f.n,f.u);
  f.L=f.v.map(i=>{const d=sub(m.P[i],f.o);return [dot(d,f.u),dot(d,f.w)];});}
/* A closed solid: after building, flip any face whose normal points into the solid (ray parity test). */
function solid(m,build){const from=m.F.length;build();const fs=m.F.slice(from);fs.forEach(f=>geom(m,f));
  const D=unit([0.3713,0.8291,0.4177]);
  for(const f of fs){const p=add(f.o,mul(f.n,1e-3));let hits=0;
    for(const g of fs){const dn=dot(D,g.n);if(Math.abs(dn)<1e-9)continue;const t=dot(sub(g.o,p),g.n)/dn;if(t<=1e-9)continue;
      const h=sub(add(p,mul(D,t)),g.o);if(inPoly(g.L,dot(h,g.u),dot(h,g.w)))hits++;}
    if(hits&1)f.v.reverse();}}
function lathe(m,rings,sides,phase=0){
  const R=rings.map(([r,y])=>Array.from({length:sides},(_,i)=>{const t=phase+i/sides*2*Math.PI;return [r*Math.cos(t),y,r*Math.sin(t)];}));
  solid(m,()=>{const last=R.length-1;
    if(rings[0][0]>0)face(m,R[0]);
    for(let k=0;k<last;k++)for(let i=0;i<sides;i++){const j=(i+1)%sides;face(m,[R[k][i],R[k][j],R[k+1][j],R[k+1][i]]);}
    if(rings[last][0]>0)face(m,R[last]);});
  return R;}
function box(m,x0,x1,y0,y1,z0,z1){const p=(x,y,z)=>[x,y,z];solid(m,()=>{
  face(m,[p(x0,y0,z0),p(x1,y0,z0),p(x1,y0,z1),p(x0,y0,z1)]);face(m,[p(x0,y1,z0),p(x1,y1,z0),p(x1,y1,z1),p(x0,y1,z1)]);
  face(m,[p(x0,y0,z0),p(x1,y0,z0),p(x1,y1,z0),p(x0,y1,z0)]);face(m,[p(x0,y0,z1),p(x1,y0,z1),p(x1,y1,z1),p(x0,y1,z1)]);
  face(m,[p(x0,y0,z0),p(x0,y0,z1),p(x0,y1,z1),p(x0,y1,z0)]);face(m,[p(x1,y0,z0),p(x1,y0,z1),p(x1,y1,z1),p(x1,y1,z0)]);});}

/* ---------- the sheets ---------- */
const SHEETS=[
 {id:'boat',no:'A-01',name:'Sailing Dinghy',mm:2600,build(m){
   const bow=[1.3,.3,0],sr=[.5,.3,.42],ar=[-.9,.3,.36],al=[-.9,.3,-.36],sl=[.5,.3,-.42],kf=[.6,0,0],ka=[-.8,0,0];
   solid(m,()=>{face(m,[bow,sr,ar,al,sl]);face(m,[ar,al,ka]);
     face(m,[sr,ar,ka]);face(m,[sr,ka,kf]);face(m,[bow,sr,kf]);
     face(m,[sl,al,ka]);face(m,[sl,ka,kf]);face(m,[bow,sl,kf]);});
   const foot=[.1,.3,0],top=[.1,2.3,0],boom=[-.85,.55,0];
   face(m,[foot,top,boom],true);face(m,[top,bow,foot],true);}},
 {id:'gem',no:'A-02',name:'Brilliant-Cut Gem',mm:40,build(m){lathe(m,[[0,-1],[1,.15],[.6,.5]],8);}},
 {id:'cabin',no:'A-03',name:'Gabled Cabin',mm:4200,build(m){
   const X=.8,Z=.6,H=1,Rg=1.7;
   solid(m,()=>{const g=x=>[[x,0,-Z],[x,0,Z],[x,H,Z],[x,Rg,0],[x,H,-Z]];
     face(m,g(-X));face(m,g(X));
     face(m,[[-X,0,-Z],[X,0,-Z],[X,0,Z],[-X,0,Z]]);
     face(m,[[-X,0,Z],[X,0,Z],[X,H,Z],[-X,H,Z]]);face(m,[[-X,0,-Z],[X,0,-Z],[X,H,-Z],[-X,H,-Z]]);
     face(m,[[-X,H,Z],[X,H,Z],[X,Rg,0],[-X,Rg,0]]);face(m,[[-X,H,-Z],[X,H,-Z],[X,Rg,0],[-X,Rg,0]]);});
   box(m,X,X+.28,0,2.05,-.2,.2);}},
 {id:'zig',no:'A-04',name:'Stepped Ziggurat',mm:9000,build(m){
   lathe(m,[[1,0],[1,.36],[.72,.36],[.72,.72],[.44,.72],[.44,1.08]],4,Math.PI/4);}},
 {id:'rocket',no:'A-05',name:'Sounding Rocket',mm:6400,build(m){
   const R=lathe(m,[[.22,0],[.3,.25],[.36,.6],[.36,1.9],[0,2.7]],6);
   for(const i of [0,2,4]){const lo=R[2][i],hi=[lo[0],1.25,lo[2]],tip=[lo[0]*2.5,.02,lo[2]*2.5];face(m,[lo,hi,tip],true);}}},
 {id:'pine',no:'A-06',name:'Mountain Pine',mm:5200,build(m){
   lathe(m,[[.12,0],[.12,.4],[.7,.4],[.3,1],[.55,1],[.2,1.5],[.4,1.5],[0,2.15]],5);}},
 {id:'light',no:'A-07',name:'Harbour Lighthouse',mm:14000,build(m){
   lathe(m,[[.55,0],[.32,1.9],[.48,1.9],[.48,2],[.26,2],[.26,2.45],[.38,2.45],[0,2.85]],6);}},
];

function finalize(s){
  const m=mesh();s.build(m);
  let lo=[1e9,1e9,1e9],hi=[-1e9,-1e9,-1e9];
  for(const p of m.P)for(let k=0;k<3;k++){lo[k]=Math.min(lo[k],p[k]);hi[k]=Math.max(hi[k],p[k]);}
  const c=mul(add(lo,hi),.5);let r=0;for(const p of m.P)r=Math.max(r,len(sub(p,c)));
  m.P=m.P.map(p=>mul(sub(p,c),1/r));m.F.forEach(f=>geom(m,f));
  m.ground=(lo[1]-c[1])/r;m.mm=s.mm/2;
  const n=m.P.length,adj=Array.from({length:n},()=>new Set());m.E=[];const seen=new Set();
  for(const f of m.F)for(let i=0;i<f.v.length;i++){const a=f.v[i],b=f.v[(i+1)%f.v.length],k=a<b?a+'_'+b:b+'_'+a;
    if(!seen.has(k)){seen.add(k);m.E.push([a,b]);adj[a].add(b);adj[b].add(a);}}
  m.incident=Array.from({length:n},()=>new Set());m.F.forEach((f,fi)=>f.v.forEach(i=>m.incident[i].add(fi)));
  /* numbering: a walk along the edges that visits every dot once, where one exists */
  let start=0;for(let i=1;i<n;i++)if(m.P[i][1]<m.P[start][1]-1e-6||(Math.abs(m.P[i][1]-m.P[start][1])<1e-6&&m.P[i][0]<m.P[start][0]))start=i;
  const vis=new Uint8Array(n),free=i=>{let d=0;for(const j of adj[i])if(!vis[j])d++;return d;};
  let path=[start],steps=0;vis[start]=1;
  const dfs=()=>{if(path.length===n)return true;if(++steps>60000)return false;
    const cand=[...adj[path[path.length-1]]].filter(j=>!vis[j]).sort((a,b)=>free(a)-free(b));
    for(const j of cand){vis[j]=1;path.push(j);if(dfs())return true;path.pop();vis[j]=0;}return false;};
  if(!dfs()){vis.fill(0);path=[start];vis[start]=1;
    while(path.length<n){const cur=path[path.length-1];let cand=[...adj[cur]].filter(j=>!vis[j]).sort((a,b)=>free(a)-free(b));
      let nx=cand[0];if(nx===undefined){let bd=1e9;for(let j=0;j<n;j++)if(!vis[j]){const d=len(sub(m.P[j],m.P[cur]));if(d<bd){bd=d;nx=j;}}}
      vis[nx]=1;path.push(nx);}}
  m.order=path;m.rank=new Int32Array(n);path.forEach((v,k)=>m.rank[v]=k);
  m.jump=path.map((v,k)=>k>0&&!adj[v].has(path[k-1]));
  return m;
}

/* ---------- state ---------- */
const $=id=>document.getElementById(id), cv=$('cv'), ctx=cv.getContext('2d');
const ISO=[-Math.PI/4,0.6155];
const st={sheet:0,done:0,mode:'connect',ops:[],yaw:ISO[0],pitch:ISO[1],zoom:1,tool:'marker',colour:'#D2382C',hatch:'diag',
  penSeen:false,revealAt:0,locateAt:0,wrong:null,rubber:null,canvas:false,scene:null,layer:'back'};
let M=null,W=0,H=0,dpr=1,S=100,cx=0,cy=0,col={},dirty=true,animUntil=0,faceOps=[],freeOps=[],opGroup=0;
let SX=[],SY=[],SZ=[],VIS=[],R0,R1,R2;
const PALETTE=['#D2382C','#E8833A','#F2C14E','#8DB580','#3E8E7E','#4BA3C7','#2F5D9B','#7A5BA8','#C97B9B','#9C6B4A','#9AA5AE','#2B3138','#F4F6F7'];

const store={get(k){try{return JSON.parse(localStorage.getItem('datum:'+k));}catch(e){return null;}},
  set(k,v){try{localStorage.setItem('datum:'+k,JSON.stringify(v));}catch(e){}}};
let saveTimer=0;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{
  store.set('sheet:'+SHEETS[st.sheet].id,{done:st.done,ops:st.ops,scene:st.scene});store.set('last',st.sheet);},250);}

function loadSheet(i){
  st.sheet=i;M=SHEETS[i].mesh||(SHEETS[i].mesh=finalize(SHEETS[i]));
  const sv=store.get('sheet:'+SHEETS[i].id)||{};
  st.done=Math.min(sv.done||0,M.order.length);st.ops=Array.isArray(sv.ops)?sv.ops.filter(o=>o&&o.f<M.F.length):[];
  st.mode=st.done===M.order.length?'colour':'connect';st.canvas=false;st.scene=sv.scene&&typeof sv.scene.yaw==='number'?sv.scene:null;st.rubber=null;st.wrong=null;
  st.yaw=ISO[0];st.pitch=ISO[1];st.zoom=1;rebuildOps();
  /* open on a view where the first dot can be seen */

function rebuildOps(){faceOps=M.F.map(()=>[]);freeOps=[];for(const o of st.ops){

/* ---------- projection ---------- */
function project(){

  M.P.forEach((p,i)=>{SX[i]=cx+S*dot(p,R0);SY[i]=cy-S*dot(p,R1);SZ[i]=dot(p,R2);});
  for(const f of M.F){f.nw=dot(f.n,R2);f.d=dot(f.o,R2);f.ox=cx+S*dot(f.o,R0);f.oy=cy-S*dot(f.o,R1);

  return inPoly(f.L,a,b)?{a,b,depth:f.d+a*f.du+b*f.dv}:null;}

/* ---------- drawing ---------- */
function readColours(){const cs=getComputedStyle(document.documentElement);
  for(const k of ['paper','panel','ink','muted','grid','face','accent'])col[k]=cs.getPropertyValue('--'+k).trim();dirty=true;}
const MONO='"IBM Plex Mono",ui-monospace,Menlo,monospace', HAND='"Architects Daughter","Bradley Hand",cursive';
function line(x0,y0,x1,y1){ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();}
function p3(p){return [cx+S*dot(p,R0),cy-S*dot(p,R1)];}

function drawSheet(plain){
  if(plain){ctx.fillStyle=col.face;ctx.fillRect(0,0,W,H);return;}
  ctx.fillStyle=col.paper;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=col.grid;ctx.lineWidth=1;
  for(const [step,al] of [[24,.28],[120,.6]]){ctx.globalAlpha=al;ctx.beginPath();
    for(let x=cx%step;x<W;x+=step){ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,H);}
    for(let y=cy%step;y<H;y+=step){ctx.moveTo(0,Math.round(y)+.5);ctx.lineTo(W,Math.round(y)+.5);}ctx.stroke();}
  ctx.globalAlpha=1;ctx.strokeStyle=col.ink;ctx.lineWidth=1.5;ctx.strokeRect(5.5,5.5,W-11,H-11);
  ctx.lineWidth=1;for(let x=cx%120;x<W;x+=120){line(x,5,x,13);line(x,H-13,x,H-5);}
  for(let y=cy%120;y<H;y+=120){line(5,y,13,y);line(W-13,y,W-5,y);}

  ctx.globalAlpha=.16;const g=M.ground,n=8,e=1.15;
  for(let i=0;i<=n;i++){const t=-e+2*e*i/n;let a=p3([t,g,-e]),b=p3([t,g,e]);line(a[0],a[1],b[0],b[1]);a=p3([-e,g,t]);b=p3([e,g,t]);line(a[0],a[1],b[0],b[1]);}

  const tx=54,ty=118;ctx.font='600 10px '+MONO;ctx.textAlign='center';ctx.textBaseline='middle';
  [['X',[1,0,0]],['Y',[0,1,0]],['Z',[0,0,1]]].forEach(([n,a])=>{const x=tx+26*dot(a,R0),y=ty-26*dot(a,R1);
    ctx.strokeStyle=ctx.fillStyle=n==='Y'?col.accent:col.ink;ctx.lineWidth=1.5;line(tx,ty,x,y);ctx.fillText(n,tx+36*dot(a,R0),ty-36*dot(a,R1));});
}

function tracePoly(f){ctx.beginPath();f.v.forEach((i,k)=>k?ctx.lineTo(SX[i],SY[i]):ctx.moveTo(SX[i],SY[i]));ctx.closePath();}

function drawSolid(alpha,clean){

function render(now){

  else if(st.mode==='reveal'){const t=Math.min(1,(now-st.revealAt)/1700),e=t*t*(3-2*t);

function loop(now){
  if(view.t0){const t=Math.min(1,(now-view.t0)/320),e=t*t*(3-2*t);st.yaw=view.y0+(view.y1-view.y0)*e;st.pitch=view.p0+(view.p1-view.p0)*e;if(t>=1)view.t0=0;dirty=true;}

function resize(){const r=cv.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,3);W=r.width;H=r.height;

/* ---------- sound: everything is synthesised, no audio files ---------- */
const snd={on:store.get('sound')!==false,ac:null};
function audio(){if(!snd.on)return null;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  if(!snd.ac){try{const ac=snd.ac=new AC(),n=ac.sampleRate*2,buf=snd.buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
    const bp=snd.bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2400;bp.Q.value=.7;
    const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=700;
    const g=snd.sg=ac.createGain();g.gain.value=0;src.connect(bp);bp.connect(hp);hp.connect(g);g.connect(ac.destination);src.start();
  }catch(e){snd.ac=null;return null;}}
  if(snd.ac.state==='suspended')snd.ac.resume().catch(()=>{});return snd.ac;}
/* pencil on paper: filtered noise whose loudness and brightness follow the speed of the nib */
function scratch(speed){const ac=audio();if(!ac)return;const t=ac.currentTime,v=Math.min(.3,.04+speed*.11)*(.75+Math.random()*.25),g=snd.sg.gain;
  g.cancelScheduledValues(t);g.setTargetAtTime(v,t,.015);g.setTargetAtTime(0,t+.07,.06);
  snd.bp.frequency.setTargetAtTime(1700+Math.min(2600,speed*1100)+Math.random()*300,t,.03);}
function hush(){if(snd.ac){const t=snd.ac.currentTime;snd.sg.gain.cancelScheduledValues(t);snd.sg.gain.setTargetAtTime(0,t,.04);}}

function tick(f,vol=.22){const ac=audio();if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.45,t+.05);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.1);
  burst(.03,.12,3500);}
const swish=()=>burst(.22,.14,1800);
const chime=()=>[0,4,7,12].forEach((n,i)=>setTimeout(()=>tick(660*Math.pow(2,n/12),.16),120+i*95));

/* ---------- interaction ---------- */
function connect(){

  if(st.done===M.order.length){st.rubber=null;st.mode='reveal';st.revealAt=performance.now();chime();toast(SHEETS[st.sheet].no+' resolved: '+SHEETS[st.sheet].name+'. Now colour it in.',4200);}

function dotAt(x,y,r){let best=-1,bd=r*r;for(let i=0;i<M.P.length;i++){if(!VIS[i]&&M.rank[i]!==st.done-1)continue;
  const d=(SX[i]-x)**2+(SY[i]-y)**2;if(d<bd){bd=d;best=i;}}return best;}
const ptrs=new Map();let drag=null,pinch=null;const view={t0:0};

function paintAt(x,y){

    drag.op.pts.push(+((x-cx)/S).toFixed(3),+((y-cy)/S).toFixed(3));dirty=true;return;}
  const h=pickFace(x,y);if(!h){drag.op=null;return;}
  if(!drag.op||drag.op.f!==h.fi){drag.op={f:h.fi,k:'stroke',c:st.colour,w:+(+$('size').value/S).toFixed(4),al:drag.al,pts:[],g:opGroup};pushOp(drag.op);}
  drag.op.pts.push(+h.a.toFixed(3),+h.b.toFixed(3));dirty=true;

cv.addEventListener('pointerdown',e=>{
  if(!$('drawer').hidden)toggleDrawer(false);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const [x,y]=pos(e);ptrs.set(e.pointerId,[x,y]);if(e.pointerType==='pen')st.penSeen=true;view.t0=0;
  if(ptrs.size===2){if(drag&&drag.type==='paint'&&drag.op)save();drag=null;st.rubber=null;const p=[...ptrs.values()];
    pinch={d:Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]),zoom:st.zoom,mx:(p[0][0]+p[1][0])/2,my:(p[0][1]+p[1][1])/2};return;}
  if(ptrs.size>2)return;
  const orbit={type:'orbit',x,y};
  if(st.mode==='connect'){
    const i=dotAt(x,y,e.pointerType==='mouse'?16:26);
    if(i>=0){const k=M.rank[i];
      if(k===st.done&&VIS[i]){connect();drag={type:'draw'};st.rubber=[x,y];}
      else if(k===st.done-1){drag={type:'draw'};st.rubber=[x,y];}
      else if(k>st.done){tick(240,.2);st.wrong={i,at:performance.now()};animUntil=performance.now()+500;drag=null;}
      else drag=orbit;
    }else drag=orbit;
  }else if(st.mode==='colour'){
    const al=+$('alpha').value/100;
    if(st.canvas&&e.pointerType==='touch'&&st.penSeen){drag=null;return;}
    const wantsOrbit=!st.canvas&&(st.tool==='orbit'||e.button===2||e.shiftKey||(e.pointerType==='touch'&&st.penSeen));
    const h=wantsOrbit?null:pickFace(x,y);
    if(st.tool==='marker'&&(h||st.canvas)){opGroup++;drag={type:'paint',op:null,free:!h,al,px:x,py:y,pt:e.timeStamp};paintAt(x,y);scratch(.4);}
    else if(!h){drag=st.canvas?null:orbit;
      if(st.canvas&&st.tool==='fill'){opGroup++;pushOp({f:-1,k:'fill',c:st.colour,al,layer:'back',g:opGroup});swish();save();}}
    else{opGroup++;pushOp(st.tool==='fill'?{f:h.fi,k:'fill',c:st.colour,al,g:opGroup}:st.tool==='hatch'?{f:h.fi,k:'hatch',c:st.colour,al,p:st.hatch,g:opGroup}:{f:h.fi,k:'clear',g:opGroup});swish();save();drag=null;}
  }else drag=orbit;
  dirty=true;
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const [x,y]=pos(e);ptrs.set(e.pointerId,[x,y]);
  if(pinch&&ptrs.size===2){const p=[...ptrs.values()],d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]),mx=(p[0][0]+p[1][0])/2,my=(p[0][1]+p[1][1])/2;
    st.zoom=Math.max(.5,Math.min(4,pinch.zoom*d/pinch.d));turn(mx-pinch.mx,my-pinch.my);pinch.mx=mx;pinch.my=my;dirty=true;return;}
  if(!drag)return;
  if(drag.type==='orbit'){turn(x-drag.x,y-drag.y);drag.x=x;drag.y=y;}
  else if(drag.type==='draw'){st.rubber=[x,y];
    if(st.mode==='connect'&&st.done<M.order.length){const n=M.order[st.done];if(VIS[n]&&Math.hypot(SX[n]-x,SY[n]-y)<(e.pointerType==='mouse'?12:18))connect();}}
  else if(drag.type==='paint'){const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const c of (evs.length?evs:[e])){const q=pos(c);paintAt(q[0],q[1]);}
    const sp=Math.hypot(x-drag.px,y-drag.py)/Math.max(1,e.timeStamp-drag.pt);drag.px=x;drag.py=y;drag.pt=e.timeStamp;if(drag.op&&sp>.01)scratch(sp);}
  dirty=true;
});
function up(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  audio();if(drag&&drag.type==='paint'){save();hush();}if(ptrs.size===0){drag=null;st.rubber=null;}dirty=true;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();st.zoom=Math.max(.5,Math.min(4,st.zoom*Math.exp(-e.deltaY*.0015)));dirty=true;},{passive:false});
function turn(dx,dy){if(st.mode==='colour'&&st.canvas)return;st.yaw+=dx*.008;st.pitch=Math.max(-Math.PI/2,Math.min(Math.PI/2,st.pitch+dy*.008));}

document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{
  const v={iso:ISO,top:[0,Math.PI/2],front:[0,0],side:[Math.PI/2,0]}[b.dataset.view];
  let y0=st.yaw%(2*Math.PI);if(y0-v[0]>Math.PI)y0-=2*Math.PI;if(v[0]-y0>Math.PI)y0+=2*Math.PI;
  Object.assign(view,{t0:performance.now(),y0,y1:v[0],p0:st.pitch,p1:v[1]});});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{st.tool=b.dataset.tool;hud();});
document.querySelectorAll('[data-hatch]').forEach(b=>b.onclick=()=>{st.hatch=b.dataset.hatch;hud();});
PALETTE.forEach(c=>{const b=document.createElement('button');b.className='sw';b.dataset.c=c;b.style.background=c;b.setAttribute('aria-label','Colour '+c);
  b.onclick=()=>{st.colour=c;if(st.tool==='wipe'||st.tool==='orbit')st.tool='marker';hud();};$('swatches').appendChild(b);});
$('btnSheets').onclick=()=>toggleDrawer();
document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{st.layer=b.dataset.layer;hud();});
$('btnSound').onclick=()=>{snd.on=!snd.on;store.set('sound',snd.on);if(snd.on)tick(1500);else hush();hud();};
$('btnCanvas').onclick=()=>{audio();view.t0=0;
  if(!st.canvas){
    if(freeOps.length&&st.scene){st.yaw=st.scene.yaw;st.pitch=st.scene.pitch;toast('Back on the canvas, at the angle you drew it.',2600);}
    else{st.scene={yaw:st.yaw,pitch:st.pitch};toast('On the canvas. The view is pinned here, so draw anywhere around the form.',4000);}
    if(st.tool==='orbit')st.tool='marker';}
  st.canvas=!st.canvas;swish();save();hud();};
$('btnLocate').onclick=()=>{st.locateAt=performance.now();animUntil=st.locateAt+2300;
  if(st.done<M.order.length&&!VIS[M.order[st.done]])toast('Dot '+String(st.done+1).padStart(2,'0')+' is behind the form. Rotate until it comes round.',2600);};
$('btnBack').onclick=()=>{if(st.done>0){st.done--;save();hud();}};
$('btnUndo').onclick=()=>{if(!st.ops.length)return;const g=st.ops[st.ops.length-1].g;while(st.ops.length&&st.ops[st.ops.length-1].g===g)st.ops.pop();rebuildOps();save();dirty=true;};
$('btnClear').onclick=()=>{opGroup++;let any=false;faceOps.forEach((l,f)=>{if(l.length){any=true;st.ops.push({f,k:'clear',g:opGroup});}});
  if(st.canvas&&freeOps.length){any=true;st.ops.push({f:-1,k:'clear',g:opGroup});}
  if(any){rebuildOps();save();dirty=true;toast('Colour cleared. Undo brings it back.',2200);}};
let armed=0;
function resetArm(on){clearTimeout(armed);armed=0;const b=$('btnReset');b.textContent=on?'Tap again to erase':'Reset this sheet';b.classList.toggle('go',!!on);if(on)armed=setTimeout(()=>resetArm(false),3000);}
$('btnReset').onclick=()=>{if(!armed){resetArm(true);return;}resetArm(false);st.done=0;st.ops=[];st.mode='connect';st.canvas=false;st.scene=null;rebuildOps();save();hud();toggleDrawer(false);};
$('btnTheme').onclick=()=>{const root=document.documentElement,dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme=dark?'light':'dark';store.set('theme',root.dataset.theme);readColours();};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColours);
new MutationObserver(readColours).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
window.addEventListener('resize',resize);

/* ---------- boot ---------- */
const th=store.get('theme');if(th==='dark'||th==='light')document.documentElement.dataset.theme=th;
opGroup=1e6+Math.floor(performance.now());
readColours();resize();loadSheet(Math.min(SHEETS.length-1,Math.max(0,store.get('last')|0)));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>dirty=true);
if(st.done===0)toast('Tap dot 01 to start, then draw from the live dot to the next number. Drag empty space to rotate; pinch to zoom.',6500);
requestAnimationFrame(loop);
window.__datum={st,SHEETS,mesh:()=>M,load:loadSheet,connect,visible:i=>VIS[i]};
})();
</script>
</body>
